<style>
/* Layout: one study column; sticky lesson picker + mode tabs; one card on stage at a time */
:root{
  --bg:#eef2f1; --surface:#ffffff; --ink:#15302e; --muted:#5b706d; --line:#d3dedb;
  --slate:#1f4d49; --slate-ink:#ffffff; --mark:#f3d23c; --mark-ink:#2a2300;
  --good:#1f7a4d; --good-bg:#dff3e7; --bad:#b0372b; --bad-bg:#fbe3df;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Source Serif 4",Georgia,serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --shadow:0 1px 0 rgba(21,48,46,.06),0 10px 30px -12px rgba(21,48,46,.25);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1b1a; --surface:#172725; --ink:#e3eeec; --muted:#93aaa6; --line:#2a3f3c;
  --slate:#8fd0c6; --slate-ink:#0f1b1a; --mark:#f3d23c; --mark-ink:#2a2300;
  --good:#6fd3a0; --good-bg:#173528; --bad:#f19a8e; --bad-bg:#3a1f1b;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1b1a; --surface:#172725; --ink:#e3eeec; --muted:#93aaa6; --line:#2a3f3c;
  --slate:#8fd0c6; --slate-ink:#0f1b1a; --mark:#f3d23c; --mark-ink:#2a2300;
  --good:#6fd3a0; --good-bg:#173528; --bad:#f19a8e; --bad-bg:#3a1f1b;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1.02;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1 em{font-style:normal;background:linear-gradient(transparent 58%,var(--mark) 58% 92%,transparent 92%);color:inherit;padding:0 .08em}
.sub{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--mark);outline-offset:2px}

/* picker */
.picker{display:flex;flex-direction:column;gap:8px}
.picker-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.label{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-display);font-weight:500;font-size:14px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;display:inline-flex;gap:6px;align-items:baseline}
.chip small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--slate);color:var(--slate-ink);border-color:var(--slate)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.75}
.linkbtn{background:none;border:0;padding:2px 4px;font-family:var(--f-display);font-weight:500;font-size:13px;color:var(--slate);text-decoration:underline;text-underline-offset:3px}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:4px;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tab{border:0;background:none;border-radius:10px;padding:9px 6px;font-family:var(--f-display);font-weight:700;font-size:15px}
.tab[aria-selected="true"]{background:var(--mark);color:var(--mark-ink)}

/* stats bar */
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:13px;color:var(--muted)}
.meter{flex:1 1 160px;height:8px;background:var(--line);border-radius:99px;overflow:hidden;min-width:120px}
.meter i{display:block;height:100%;background:var(--good);width:0;transition:width .4s}

/* flashcard */
.stage{perspective:1400px}
.card{position:relative;width:100%;min-height:300px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1);cursor:pointer;border:0;background:none;padding:0;text-align:left;display:grid}
.card.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);border:1.5px solid var(--line);padding:22px 22px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.face.back{transform:rotateY(180deg)}
.face-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.word{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,8vw,48px);line-height:1.05;letter-spacing:-.015em;margin:auto 0;text-wrap:balance;overflow-wrap:anywhere}
.ru-big{font-family:var(--f-body);font-weight:600;font-size:clamp(24px,6vw,34px);line-height:1.2;margin:auto 0;overflow-wrap:anywhere}
.hint{font-family:var(--f-display);font-size:13px;color:var(--muted)}
.back .w-small{font-family:var(--f-display);font-weight:700;font-size:20px}
.back .ru{font-weight:600;font-size:19px;color:var(--slate)}
.back .def{font-size:17px}
.back .ex{font-style:italic;color:var(--muted);border-left:3px solid var(--mark);padding-left:12px}
.back .ex b{font-style:normal;color:var(--ink);font-weight:600}
.speak{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;flex:none}
.speak svg{width:16px;height:16px;fill:currentColor}

.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-family:var(--f-display);font-weight:700;font-size:16px}
.btn.learn{border-color:var(--bad);color:var(--bad)}
.btn.know{background:var(--good);border-color:var(--good);color:var(--surface)}
.btn.primary{background:var(--slate);border-color:var(--slate);color:var(--slate-ink)}
.btn:disabled{opacity:.45;cursor:default}
.tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;font-size:14px}
.tools .grp{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.small-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-family:var(--f-display);font-weight:500;font-size:13px}
.small-btn[aria-pressed="true"]{border-color:var(--slate);color:var(--slate);font-weight:700}

/* quiz */
.q{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.q-kind{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.prompt{font-size:20px;line-height:1.4;overflow-wrap:anywhere}
.prompt.ru{font-weight:600;font-size:24px}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);margin:0 .15em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;text-align:left;font-family:var(--f-display);font-weight:500;font-size:16px;line-height:1.25;display:flex;gap:10px;align-items:baseline;min-width:0;overflow-wrap:anywhere}
.opt .k{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:none}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.feedback{font-size:15px;min-height:1.5em}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}
.typebox{display:flex;gap:8px;flex-wrap:wrap}
.typebox input{flex:1 1 220px;min-width:0;font-family:var(--f-display);font-size:18px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.typebox input.right{border-color:var(--good);background:var(--good-bg)}
.typebox input.wrong{border-color:var(--bad);background:var(--bad-bg)}
.setup{display:flex;flex-direction:column;gap:14px}
.setup .opts-line{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* results */
.score{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:1;letter-spacing:-.03em}
.miss{display:flex;flex-direction:column;gap:0;border-top:1.5px solid var(--line)}
.miss div{padding:10px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px;font-size:15px}
.miss b{font-family:var(--f-display)}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border-radius:20px;border:1.5px dashed var(--line)}
footer{font-size:13px;color:var(--muted)}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}
@media (prefers-reduced-motion:reduce){.card{transition:none}.meter i{transition:none}}
@media (hover:none){.desk{display:none}}
</style>
<style>
.why{border-left:3px solid var(--bad);background:var(--bad-bg);padding:10px 14px;border-radius:0 10px 10px 0;font-size:16px;display:flex;flex-direction:column;gap:6px}
.why.good{border-left-color:var(--good);background:var(--good-bg)}
.why .h{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--bad)}
.why.good .h{color:var(--good)}
.rule{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.rule b{font-family:var(--f-display);color:var(--ink);font-weight:700}
.sit{font-size:19px;line-height:1.45;overflow-wrap:anywhere}
.gap{display:inline-block;min-width:4em;border-bottom:2px solid var(--ink);margin:0 .1em;height:1em;vertical-align:baseline}
.opts.stack{grid-template-columns:1fr}
.box{border:1.5px dashed var(--line);border-radius:12px;padding:10px 14px;font-family:var(--f-display);font-size:14px;line-height:1.6;color:var(--ink);background:var(--bg)}
.box .label{display:block;margin-bottom:2px}
.tabs4{grid-template-columns:repeat(4,1fr)}
@media (max-width:420px){.tab{font-size:13px;padding:9px 2px}}
.prog-hero{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.prog-hero{grid-template-columns:1fr}}
.tile{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile .big{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;letter-spacing:-.02em}
.tile .big small{font-size:16px;color:var(--muted);font-weight:500}
.rows{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
@media (max-width:560px){.prow{grid-template-columns:minmax(0,1fr) auto}.prow .meter{grid-column:1/-1;grid-row:2}}
.prow .t{font-family:var(--f-display);font-weight:500;font-size:15px;min-width:0}
.prow .t small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pill{font-family:var(--f-mono);font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.pill.warn{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.pill.go{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.prow button{border:0;background:none;cursor:pointer;padding:0;text-align:left}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.scard{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:104px}
.scard .L{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1}
.scard .tp{font-family:var(--f-display);font-weight:500;font-size:14px}
.scard.done{border-color:var(--good)}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.vitem{background:var(--bg);border-radius:10px;padding:8px 12px;min-width:0}
.vitem b{font-family:var(--f-display);font-weight:700;display:block}
.vitem span{font-size:14px;color:var(--muted)}
.qlist{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;font-size:17px}
.timer{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ring{--p:1;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--slate) calc(var(--p)*360deg),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:66px;height:66px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.ring.over{background:conic-gradient(var(--bad) 360deg,var(--line) 0)}
.note{font-size:14px;color:var(--muted)}
</style>

/* ---------- PROGRESS ---------- */
function Progress(){
  const sum=topics=>{let m=0,t=0;topics.forEach(x=>{m+=masteredIn(x);t+=x.items.length});return[m,t]};
  const [gm,gt]=sum(D.grammar),[vm,vt]=sum(D.vocab);
  const sp=D.speaking.filter(c=>P.spoken[c.id]).length;
  const pct=(a,b)=>b?Math.round(a/b*100):0;
  const tile=(label,a,b,unit)=>`<div class="tile"><span class="label">${label}</span><span class="big">${pct(a,b)}%</span><div class="meter"><i style="width:${pct(a,b)}%"></i></div><span class="mono" style="font-size:12px;color:var(--muted)">${a} / ${b} ${unit}</span></div>`;
  const row=t=>{const m=masteredIn(t),n=t.items.length,tr=P.tries[t.id]||0,b=P.best[t.id];
    let pill=(tr===0&&m===0)?'<span class="pill go">Start</span>':m===n?'<span class="pill ok">Mastered</span>':(tr>0&&m/n<.6?'<span class="pill warn">Needs work</span>':'<span class="pill">In progress</span>');
    return `<div class="prow"><button data-go="${t.id}" class="t">${esc(t.title)}<small>${m}/${n} correct · ${tr} ${tr===1?'try':'tries'}</small></button><div class="meter" aria-hidden="true"><i style="width:${pct(m,n)}%"></i></div><button data-go="${t.id}">${pill}</button></div>`};
  const any=Object.keys(P.tries).length||Object.keys(P.mastered).length||sp;
  view.innerHTML=`<div style="display:flex;flex-direction:column;gap:16px">
    <div class="prog-hero">${tile('Grammar',gm,gt,'questions')}${tile('Vocabulary',vm,vt,'questions')}${tile('Speaking',sp,10,'cards practised')}</div>
    ${any?'':'<div class="empty">No progress yet. Pick a topic below to start. A question counts as done once you answer it correctly.</div>'}
    <div class="sec-h"><span class="label">Grammar topics</span><button class="linkbtn" data-weak="grammar">Practise my weak grammar</button></div>
    <div class="rows">${D.grammar.map(row).join('')}</div>
    <div class="sec-h"><span class="label">Vocabulary topics</span><button class="linkbtn" data-weak="vocab">Practise my weak vocabulary</button></div>
    <div class="rows">${D.vocab.map(row).join('')}</div>
    <div class="sec-h"><span class="label">Speaking cards</span><span class="mono" style="font-size:12px;color:var(--muted)">${sp}/10 practised</span></div>
    <div class="cards">${D.speaking.map(c=>`<button class="scard${P.spoken[c.id]?' done':''}" data-card="${c.id}"><span class="L">${c.id}</span><span class="tp">${esc(c.topic)}</span>${P.spoken[c.id]?'<span class="pill ok" style="align-self:flex-start">Practised</span>':''}</button>`).join('')}</div>
    <div style="display:flex;justify-content:flex-end"><button class="small-btn" id="reset">Reset all progress</button></div></div>`;
  view.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const id=b.dataset.go,sec=id[0]==='g'?'grammar':'vocab';curTopic[sec]=id;store.set(sec==='grammar'?'tg':'tv',id);setTab(sec)});
  view.querySelectorAll('[data-weak]').forEach(b=>b.onclick=()=>{const sec=b.dataset.weak;setTab(sec);Quiz.weak(sec)});
  view.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{setTab('speaking');Speaking.open(b.dataset.card)});
  const r=document.getElementById('reset');r.onclick=()=>{if(r.dataset.c){P={mastered:{},best:{},tries:{},spoken:{}};save();Progress()}else{r.dataset.c=1;r.textContent='Tap again to delete all progress'}};
}

/* ---------- SECTION (grammar / vocab) ---------- */
function Section(sec){
  const S=SECTIONS[sec];
  view.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">
    <section class="picker"><div class="picker-head"><span class="label">${S.name} topics</span><button class="linkbtn" id="weakBtn">Practise my weak questions</button></div>
    <div class="chips" id="chips"></div></section>
    <section class="picker"><div class="picker-head"><span class="label">Sets of 20 questions</span></div><div class="chips" id="sets"></div></section>
    <div id="stage"></div></div>`;
  const chips=()=>{document.getElementById('chips').innerHTML=S.topics.map((t,i)=>{const m=masteredIn(t),n=t.items.length;
    return `<button class="chip" data-id="${t.id}" aria-pressed="${curTopic[sec]===t.id}">${i+1}. ${esc(t.title)} <small>${m}/${n}</small></button>`}).join('')};
  const sets=()=>{const t=topicById(curTopic[sec])||S.topics[0],k=Math.ceil(t.items.length/SET),cur=Quiz.weakMode?-1:setFor(t);
    document.getElementById('sets').innerHTML=Array.from({length:k},(_,s)=>{const a=s*SET,b=Math.min(a+SET,t.items.length),m=t.items.slice(a,b).filter((_,j)=>P.mastered[t.id+':'+(a+j)]).length;
      return `<button class="chip" data-s="${s}" aria-pressed="${cur===s}">Set ${s+1} <small>${m}/${b-a}</small></button>`}).join('')};
  const refresh=()=>{chips();sets()};
  chips(); Quiz.onChange=refresh;
  document.getElementById('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;curTopic[sec]=b.dataset.id;store.set(sec==='grammar'?'tg':'tv',b.dataset.id);const t=topicById(b.dataset.id);Quiz.start(sec,t,setFor(t));refresh()};
  document.getElementById('sets').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const t=topicById(curTopic[sec]);setSet(t,+b.dataset.s);Quiz.start(sec,t,+b.dataset.s);sets()};
  document.getElementById('weakBtn').onclick=()=>{Quiz.weak(sec);sets()};
  const t0=topicById(curTopic[sec])||S.topics[0];Quiz.start(sec,t0,setFor(t0));sets();
}

    const st=document.getElementById('stage'); if(!st)return;
    if(this.i>=this.qs.length) return this.results();
    const q=this.qs[this.i],t=topicById(q.tid); this.answered=false;
    st.innerHTML=`<div class="q"><div class="q-kind"><span>${this.head()}</span><span class="mono">${this.i+1}/${this.qs.length} · ${this.score} ✓</span></div>
      <div class="label" style="text-transform:none;letter-spacing:0;font-size:14px">${esc(t.intro)}</div>
      ${t.box?`<div class="box"><span class="label">${t.boxLabel||'Words'}</span>${esc(t.box)}</div>`:''}
      <div class="sit">${fmt(q.p)}</div>
      <div class="opts stack">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${LET[k]})</span><span>${esc(o.t)}</span></button>`).join('')}</div>
      <div id="fb" aria-live="polite"></div>
      <button class="btn primary" id="next" hidden>Next question</button></div>`;
    st.querySelectorAll('.opt').forEach(b=>b.onclick=()=>this.answer(+b.dataset.k));
    document.getElementById('next').onclick=()=>{this.i++;this.draw();st.scrollIntoView({block:'start',behavior:'smooth'})};
  },
  answer(k){
    if(this.answered)return;this.answered=true;
    const st=document.getElementById('stage'),q=this.qs[this.i],o=q.opts[k],btns=st.querySelectorAll('.opt');
    btns.forEach((b,j)=>{b.disabled=true;if(q.opts[j].ok)b.classList.add('right')});
    const fb=document.getElementById('fb');
    if(o.ok){this.score++;P.mastered[q.tid+':'+q.n]=1;save();
      fb.innerHTML=`<div class="why good"><span class="h">Correct!</span><span class="rule"><b>${this.sec==='vocab'?'Remember':'Rule'}:</b> ${esc(q.tip)}</span></div>`}
    else{btns[k].classList.add('wrong');this.missed.push({q,pick:o});
      fb.innerHTML=`<div class="why"><span class="h">Not quite. “${esc(o.t)}” is wrong.</span><span>${esc(o.why)}</span><span>Correct: <b>${esc(q.c)}</b></span><span class="rule"><b>${this.sec==='vocab'?'Remember':'Rule'}:</b> ${esc(q.tip)}</span></div>`}
    const n=document.getElementById('next');n.hidden=false;n.textContent=this.i+1>=this.qs.length?'See results':'Next question';n.focus({preventScroll:true});
  },
  results(){
    const st=document.getElementById('stage'),total=this.qs.length,pct=Math.round(this.score/total*100);
    let nextBtn='';
    let goNext=null;
    if(!this.weakMode){const id=this.topic.id,k=id+':'+this.set;P.tries[id]=(P.tries[id]||0)+1;P.best[k]=Math.max(P.best[k]??0,this.score);save();
      const nSets=Math.ceil(this.topic.items.length/SET),list=SECTIONS[this.sec].topics,ix=list.indexOf(this.topic);
      if(this.set+1<nSets){nextBtn='<button class="btn" id="nextTopic">Next set</button>';goNext=()=>this.start(this.sec,this.topic,this.set+1)}
      else if(ix<list.length-1){nextBtn='<button class="btn" id="nextTopic">Next topic</button>';goNext=()=>{const nx=list[ix+1];curTopic[this.sec]=nx.id;store.set(this.sec==='grammar'?'tg':'tv',nx.id);this.start(this.sec,nx,setFor(nx))}}}
    if(this.onChange)this.onChange();
    const msg=pct>=90?'Excellent work.':pct>=70?'Good. Check the ones you missed below.':pct>=50?'Getting there. Read the explanations and try again.':'Read the rules below, then try this topic again.';
    st.innerHTML=`<div class="q"><div class="label">${this.head()} · Results</div>
      <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap"><span class="score mono">${this.score}/${total}</span><span style="font-size:18px">${pct}% · ${msg}</span></div>
      ${this.missed.length?`<div class="label">Your mistakes</div><div class="miss">${this.missed.map(m=>`<div style="grid-template-columns:1fr"><span style="color:var(--muted)">${fmt(m.q.p)}</span><span style="color:var(--bad);text-decoration:line-through">${esc(m.pick.t)}</span><b>${esc(m.q.c)}</b><span>${esc(m.pick.why)}</span></div>`).join('')}</div>`:''}
      <div class="row"><button class="btn primary" id="again">Try again</button>${this.missed.length?'<button class="btn" id="retry">Retry my mistakes</button>':''}${nextBtn}</div></div>`;
    document.getElementById('again').onclick=()=>this.weakMode?this.weak(this.sec):this.start(this.sec,this.topic,this.set);
    const r=document.getElementById('retry');if(r){const m=this.missed.map(x=>x.q);r.onclick=()=>{this.qs=this.build(shuffle(m));this.i=0;this.score=0;this.missed=[];this.draw()}}
    const nt=document.getElementById('nextTopic');if(nt)nt.onclick=()=>{goNext();if(this.onChange)this.onChange()};
    st.scrollIntoView({block:'start',behavior:'smooth'});
  }
};

/* ---------- SPEAKING ---------- */
const Speaking={
  timer:null,
  stop(){if(this.timer){clearInterval(this.timer);this.timer=null}},
  list(){this.stop();
    view.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">
      <div class="q" style="gap:8px"><div class="label">Speaking cards</div><div style="font-size:16px">Each card has Part 1 (short answers, about 30 seconds) and Part 2 (longer answers, about 1 minute). Learn the topic words first, then start the timed practice.</div>
      <div class="note">Tip: open your phone's voice recorder while you practise, then listen back and check your grammar and the topic words you used.</div></div>
      <div class="cards">${D.speaking.map(c=>`<button class="scard${P.spoken[c.id]?' done':''}" data-card="${c.id}"><span class="L">Card ${c.id}</span><span class="tp">${esc(c.topic)}</span>${P.spoken[c.id]?'<span class="pill ok" style="align-self:flex-start">Practised</span>':''}</button>`).join('')}</div>
      <button class="btn" id="rand">Give me a random card</button></div>`;
    view.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>this.open(b.dataset.card));
    document.getElementById('rand').onclick=()=>this.open(D.speaking[Math.random()*D.speaking.length|0].id);
  },
  open(id){this.stop();const c=D.speaking.find(x=>x.id===id);
    view.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">
      <button class="linkbtn" id="back" style="align-self:flex-start">← All cards</button>
      <div class="q"><div class="q-kind"><span>Card ${c.id}</span>${P.spoken[c.id]?'<span class="pill ok">Practised</span>':''}</div>
        <h2 style="font-family:var(--f-display);font-weight:800;font-size:28px;margin:0;letter-spacing:-.01em">${esc(c.topic)}</h2>
        <div class="label">Topic vocabulary: try to use 3 or more</div>
        <div class="vlist">${c.vocab.map(v=>`<div class="vitem"><b>${esc(v[0])}</b><span>${esc(v[1])}</span></div>`).join('')}</div>
        <div class="label">Part 1</div><ol class="qlist">${c.p1.map(q=>`<li>${esc(q)}</li>`).join('')}</ol>
        <div class="label">Part 2</div><ol class="qlist">${c.p2.map(q=>`<li>${esc(q)}</li>`).join('')}</ol>
        <button class="btn primary" id="go">Start timed practice</button></div></div>`;
    document.getElementById('back').onclick=()=>this.list();
    document.getElementById('go').onclick=()=>this.practice(c,0);
  },
  practice(c,i){this.stop();
    const qs=[...c.p1.map(q=>({q,part:1,sec:30})),...c.p2.map(q=>({q,part:2,sec:60}))];
    if(i>=qs.length){P.spoken[c.id]=1;save();
      view.innerHTML=`<div class="q"><div class="label">Card ${c.id} · ${esc(c.topic)}</div><span class="score">Done!</span>
        <div style="font-size:17px">You answered all 8 questions. This card is now marked as practised.</div>
        <div class="row"><button class="btn primary" id="again">Practise again</button><button class="btn" id="all">All cards</button></div></div>`;
      document.getElementById('again').onclick=()=>this.practice(c,0);document.getElementById('all').onclick=()=>this.list();return}
    const q=qs[i];let left=q.sec,running=false;
    view.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px"><button class="linkbtn" id="back" style="align-self:flex-start">← Card ${c.id}</button>
      <div class="q"><div class="q-kind"><span>Card ${c.id} · Part ${q.part}</span><span class="mono">${i+1}/8</span></div>
      <div class="sit" style="font-size:22px;font-weight:600">${esc(q.q)}</div>
      <div class="timer"><div class="ring" id="ring"><span id="sec">${q.sec}</span></div>
        <div style="display:flex;flex-direction:column;gap:4px"><span class="note">${q.part===1?'Part 1: give a short answer with a reason (about 30 seconds).':'Part 2: give a longer answer with reasons and examples (about 1 minute).'}</span>
        <span class="note">Words to try: ${c.vocab.slice(0,5).map(v=>esc(v[0])).join(' · ')}</span></div></div>
      <div class="row"><button class="btn primary" id="tbtn">Start timer</button><button class="btn" id="nbtn">${i+1<8?'Next question':'Finish card'}</button></div></div></div>`;
    const ring=document.getElementById('ring'),sec=document.getElementById('sec'),tb=document.getElementById('tbtn');
    const paint=()=>{sec.textContent=left>=0?left:'+'+(-left);ring.style.setProperty('--p',Math.max(left,0)/q.sec);ring.classList.toggle('over',left<0)};
    tb.onclick=()=>{if(running){this.stop();running=false;tb.textContent='Resume'}else{running=true;tb.textContent='Pause';this.timer=setInterval(()=>{left--;paint()},1000)}};
    document.getElementById('nbtn').onclick=()=>this.practice(c,i+1);
    document.getElementById('back').onclick=()=>this.open(c.id);
  }
};

document.addEventListener('keydown',e=>{
  if(/^[1-3]$/.test(e.key)&&document.querySelector('#stage .opt:not([disabled])')){const n=+e.key-1;if(n<Quiz.qs[Quiz.i]?.opts.length)Quiz.answer(n)}
});
if(!['progress','grammar','vocab','speaking'].includes(tab))tab='progress';
setTab(tab);
</script>
