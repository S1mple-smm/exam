<style>
/* Layout: one study column; sticky lesson picker + mode tabs; one card on stage at a time */
:root{
  --bg:#eef2f1; --surface:#ffffff; --ink:#15302e; --muted:#5b706d; --line:#d3dedb;
  --slate:#1f4d49; --slate-ink:#ffffff; --mark:#f3d23c; --mark-ink:#2a2300;
  --good:#1f7a4d; --good-bg:#dff3e7; --bad:#b0372b; --bad-bg:#fbe3df;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Source Serif 4",Georgia,serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --shadow:0 1px 0 rgba(21,48,46,.06),0 10px 30px -12px rgba(21,48,46,.25);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1b1a; --surface:#172725; --ink:#e3eeec; --muted:#93aaa6; --line:#2a3f3c;
  --slate:#8fd0c6; --slate-ink:#0f1b1a; --mark:#f3d23c; --mark-ink:#2a2300;
  --good:#6fd3a0; --good-bg:#173528; --bad:#f19a8e; --bad-bg:#3a1f1b;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1b1a; --surface:#172725; --ink:#e3eeec; --muted:#93aaa6; --line:#2a3f3c;
  --slate:#8fd0c6; --slate-ink:#0f1b1a; --mark:#f3d23c; --mark-ink:#2a2300;
  --good:#6fd3a0; --good-bg:#173528; --bad:#f19a8e; --bad-bg:#3a1f1b;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1.02;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1 em{font-style:normal;background:linear-gradient(transparent 58%,var(--mark) 58% 92%,transparent 92%);color:inherit;padding:0 .08em}
.sub{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--mark);outline-offset:2px}

/* picker */
.picker{display:flex;flex-direction:column;gap:8px}
.picker-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.label{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-display);font-weight:500;font-size:14px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;display:inline-flex;gap:6px;align-items:baseline}
.chip small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--slate);color:var(--slate-ink);border-color:var(--slate)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.75}
.linkbtn{background:none;border:0;padding:2px 4px;font-family:var(--f-display);font-weight:500;font-size:13px;color:var(--slate);text-decoration:underline;text-underline-offset:3px}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:4px;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tab{border:0;background:none;border-radius:10px;padding:9px 6px;font-family:var(--f-display);font-weight:700;font-size:15px}
.tab[aria-selected="true"]{background:var(--mark);color:var(--mark-ink)}

/* stats bar */
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:13px;color:var(--muted)}
.meter{flex:1 1 160px;height:8px;background:var(--line);border-radius:99px;overflow:hidden;min-width:120px}
.meter i{display:block;height:100%;background:var(--good);width:0;transition:width .4s}

/* flashcard */
.stage{perspective:1400px}
.card{position:relative;width:100%;min-height:300px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1);cursor:pointer;border:0;background:none;padding:0;text-align:left;display:grid}
.card.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);border:1.5px solid var(--line);padding:22px 22px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.face.back{transform:rotateY(180deg)}
.face-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.word{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,8vw,48px);line-height:1.05;letter-spacing:-.015em;margin:auto 0;text-wrap:balance;overflow-wrap:anywhere}
.ru-big{font-family:var(--f-body);font-weight:600;font-size:clamp(24px,6vw,34px);line-height:1.2;margin:auto 0;overflow-wrap:anywhere}
.hint{font-family:var(--f-display);font-size:13px;color:var(--muted)}
.back .w-small{font-family:var(--f-display);font-weight:700;font-size:20px}
.back .ru{font-weight:600;font-size:19px;color:var(--slate)}
.back .def{font-size:17px}
.back .ex{font-style:italic;color:var(--muted);border-left:3px solid var(--mark);padding-left:12px}
.back .ex b{font-style:normal;color:var(--ink);font-weight:600}
.speak{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;flex:none}
.speak svg{width:16px;height:16px;fill:currentColor}

.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-family:var(--f-display);font-weight:700;font-size:16px}
.btn.learn{border-color:var(--bad);color:var(--bad)}
.btn.know{background:var(--good);border-color:var(--good);color:var(--surface)}
.btn.primary{background:var(--slate);border-color:var(--slate);color:var(--slate-ink)}
.btn:disabled{opacity:.45;cursor:default}
.tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;font-size:14px}
.tools .grp{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.small-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-family:var(--f-display);font-weight:500;font-size:13px}
.small-btn[aria-pressed="true"]{border-color:var(--slate);color:var(--slate);font-weight:700}

/* quiz */
.q{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.q-kind{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.prompt{font-size:20px;line-height:1.4;overflow-wrap:anywhere}
.prompt.ru{font-weight:600;font-size:24px}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);margin:0 .15em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;text-align:left;font-family:var(--f-display);font-weight:500;font-size:16px;line-height:1.25;display:flex;gap:10px;align-items:baseline;min-width:0;overflow-wrap:anywhere}
.opt .k{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:none}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.feedback{font-size:15px;min-height:1.5em}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}
.typebox{display:flex;gap:8px;flex-wrap:wrap}
.typebox input{flex:1 1 220px;min-width:0;font-family:var(--f-display);font-size:18px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.typebox input.right{border-color:var(--good);background:var(--good-bg)}
.typebox input.wrong{border-color:var(--bad);background:var(--bad-bg)}
.setup{display:flex;flex-direction:column;gap:14px}
.setup .opts-line{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* results */
.score{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:1;letter-spacing:-.03em}
.miss{display:flex;flex-direction:column;gap:0;border-top:1.5px solid var(--line)}
.miss div{padding:10px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px;font-size:15px}
.miss b{font-family:var(--f-display)}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border-radius:20px;border:1.5px dashed var(--line)}
footer{font-size:13px;color:var(--muted)}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}
@media (prefers-reduced-motion:reduce){.card{transition:none}.meter i{transition:none}}
@media (hover:none){.desk{display:none}}
</style>
<style>
.why{border-left:3px solid var(--bad);background:var(--bad-bg);padding:10px 14px;border-radius:0 10px 10px 0;font-size:16px;display:flex;flex-direction:column;gap:6px}
.why.good{border-left-color:var(--good);background:var(--good-bg)}

.why.good .h{color:var(--good)}
.rule{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.rule b{font-family:var(--f-display);color:var(--ink);font-weight:700}
.sit{font-size:19px;line-height:1.45;overflow-wrap:anywhere}
.gap{display:inline-block;min-width:4em;border-bottom:2px solid var(--ink);margin:0 .1em;height:1em;vertical-align:baseline}
.opts.stack{grid-template-columns:1fr}
.box{border:1.5px dashed var(--line);border-radius:12px;padding:10px 14px;font-family:var(--f-display);font-size:14px;line-height:1.6;color:var(--ink);background:var(--bg)}
.box .label{display:block;margin-bottom:2px}
.tabs4{grid-template-columns:repeat(4,1fr)}
@media (max-width:420px){.tab{font-size:13px;padding:9px 2px}}
.prog-hero{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.prog-hero{grid-template-columns:1fr}}
.tile{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile .big{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;letter-spacing:-.02em}
.tile .big small{font-size:16px;color:var(--muted);font-weight:500}
.rows{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
@media (max-width:560px){.prow{grid-template-columns:minmax(0,1fr) auto}.prow .meter{grid-column:1/-1;grid-row:2}}
.prow .t{font-family:var(--f-display);font-weight:500;font-size:15px;min-width:0}
.prow .t small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pill{font-family:var(--f-mono);font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.pill.warn{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.pill.go{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.prow button{border:0;background:none;cursor:pointer;padding:0;text-align:left}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.scard{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:104px}
.scard .L{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1}
.scard .tp{font-family:var(--f-display);font-weight:500;font-size:14px}
.scard.done{border-color:var(--good)}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.vitem{background:var(--bg);border-radius:10px;padding:8px 12px;min-width:0}
.vitem b{font-family:var(--f-display);font-weight:700;display:block}
.vitem span{font-size:14px;color:var(--muted)}
.qlist{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;font-size:17px}
.timer{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ring{--p:1;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--slate) calc(var(--p)*360deg),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:66px;height:66px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.ring.over{background:conic-gradient(var(--bad) 360deg,var(--line) 0)}
.note{font-size:14px;color:var(--muted)}
</style>

<script>
const D = {"grammar": [{"id": "g1", "title": "used to / would / be used to / get used to", "intro": "Choose the correct form to complete the sentence.", "items": [{"p": "When I first joined the company, we ___ in a small office with no windows.", "c": "used to work", "w": [["are used to working", "\"Be used to\" means \"be accustomed to\" (something feels normal). Here we are describing a past habit that has stopped, so use used to / would + base verb."], ["would've worked", "\"Would have + V3\" is for imaginary past situations (third conditional), not past habits."]], "tip": "used to / would + verb = past habit (would: actions only) · be used to + -ing = it feels normal · get used to + -ing = it is becoming normal"}, {"p": "I'm slowly ___ giving presentations in front of large groups.", "c": "getting used to", "w": [["used to", "\"Used to\" (past habit) can't follow \"I'm\" like this. For a process of becoming accustomed, use \"getting used to\" + -ing."], ["would", "\"Would\" doesn't mean \"accustomed to\". To talk about something becoming normal, use get used to + -ing."]], "tip": "used to / would + verb = past habit (would: actions only) · be used to + -ing = it feels normal · get used to + -ing = it is becoming normal"}, {"p": "When we lived in the countryside, my sister and I ___ long walks after dinner.", "c": "would take", "w": [["are used to take", "\"Be / get used to\" is followed by a noun or -ing form (used to working), not the base verb."], ["used to taking", "\"Used to\" for a past habit is followed by the base verb (used to work), not -ing."]], "tip": "used to / would + verb = past habit (would: actions only) · be used to + -ing = it feels normal · get used to + -ing = it is becoming normal"}, {"p": "After he moved abroad, he had to ___ for himself every day.", "c": "get used to cooking", "w": [["would cooking", "\"Would\" is followed by the base verb, never -ing."], ["used to cook", "After \"had to\" you need a base verb: \"get used to cooking\". \"H lowed by \"to + verb\" or \"that + clause\", not -ing."], ["The fans demanded on meeting the singer.", "We don't say \"demand on\". Use \"demand to + verb\" or \"demand that…\"."]], "tip": "demand to + verb · demand that + someone (should) + verb"}, {"p": "The manager insisted that everyone attend the training. → DEMAND", "c": "The manager demanded that everyone attend the training.", "w": [["The manager demanded everyone to attend the training.", "\"Demand\" isn't followed by a person + to + verb. Use \"demand that someone (should) do something\"."], ["The manager demanded on everyone attending the training.", "We don't say \"demand on\". Use \"demand to + verb\" or \"demand that…\"."]], "tip": "demand to + verb · demand that + someone (should) + verb"}]}], "vocab": [{"id": "w1", "title": "Word formation: nouns", "intro": "Complete the sentence with the correct NOUN formed from the word in brackets.", "box": "-ence / -ance · -tion / -sion · -ness · -ity · -th · -ment · -ure", "boxLabel": "Endings", "items": [{"p": "She answered the questions with great ___. (confident)", "c": "confidence", "w": [["confidentness", "\"confidentness\" is not an English word."], ["confident", "\"confident\" is an adjective, but the gap needs a noun: \"confidence\"."]], "tip": "-ent → -ence: confident → confidence"}, {"p": "His sudden decision caused a lot of ___ among the team. (confuse)", "c": "confusion", "w": [["confusement", "\"confusement\" is not an English word."], ["confusing", "\"confusing\" is an adjective, but the gap needs a noun: \"confusion\"."]], "tip": "-se → -sion: confuse → confusion"}, {"p": "The manager apologised for the ___ in communication. (fail)", "c": "failure", "w": [["failment", "\"failment\" is not an English word."], ["failing", "\"failing\" is a verb (-ing form), but the gap needs a noun: \"failure\"."]], "tip": "-ure: fail → failure"}, {"p": "This device is popular because of its ___ and simple controls. (convenient)", "c": "convenience", "w": [["convenientness", "\"convenientness\" is not an English word."], ["conveniently", "\"conveniently\" is an adverb, but the gap needs a noun: \"convenience\"."]], "tip": "-ent → -ence: convenient → convenience"}, {"p": "The players showed real ___ despite the loss. (strong)", "c": "strength", "w": [["strongness", "\"strongness\" is not an English word."], ["strongly", "\"strongly\" is an adverb, but the gap needs a noun: \"strength\"."]], "tip": "-th: strong → strength"}, {"p": "There has been a steady ___ in online shopping over the past year. (grow)", "c": "growth", "w": [["growness", "\"growness\" is not an English word."], ["grown", "\"grown\" is a verb (past form), but the gap needs a noun: \"growth\"."]], "tip": "-th: grow → growth"}, {"p": "Her ___ to take responsibility impressed everyone. (ready)", "c": "readiness", "w": [["readyness", "Change -y to -i before -ness: readiness."], ["readily", "\"readily\" is an adverb, but the gap needs a noun: \"readiness\"."]], "tip": "-y → -iness: ready → readiness"}, {"p": "The project was completed with great ___. (efficient)", "c": "efficiency", "w": [["efficientness", "\"efficientness\" is not an English word."], ["efficiently", "\"efficiently\" is an adverb, but the gap needs a noun: \"efficiency\"."]], "tip": "-ent → -ency: efficient → efficiency"}, {"p": "The ___ of the bridge took three years. (construct)", "c": "construction", "w": [["constructment", "\"constructment\" is not an English word."], ["constructive", "\"constructive\" is an adjective, but the gap needs a noun: \"construction\"."]], "tip": "-t → -tion: construct → construction"}, {"p": "We were amazed by the ___ of the mountains. (beautiful)", "c": "beauty", "w": [["beautifulness", "\"beautifulness\" is not an English word."], ["beautifully", "\"beautifully\" is an adverb, but the gap needs a noun: \"beauty\"."]], "tip": "beautiful → beauty"}, {"p": "The ___ of the river is about two kilometres. (wide)", "c": "width", "w": [["wideness", "\"Wideness\" is rare. For measurement we say \"width\"."], ["widely", "\"widely\" is an adverb, but the gap needs a noun: \"width\"."]], "tip": "-th: wide → width"}, {"p": "I can't stand the ___ of this town at night. (noisy)", "c": "noise", "w": [["noisiness", "\"Noisiness\" is very rare. The normal noun is \"noise\"."], ["noisily", "\"noisily\" is an adverb, but the gap needs a noun: \"noise\"."]], "tip": "noisy → noise"}, {"p": "The doctor stressed the ___ of sleep for good health. (important)", "c": "importance", "w": [["importancy", "\"importancy\" is not an English word."], ["important", "\"important\" is an adjective, but the gap needs a noun: \"importance\"."]], "tip": "-ant → -ance: important → importance"}, {"p": "His ___ of the city helped us find the best cafés. (know)", "c": "knowledge", "w": [["knowment", "\"knowment\" is not an English word."], ["known", "\"known\" is a verb (past form), but the gap needs a noun: \"knowledge\"."]], "tip": "know → knowledge"}, {"p": "There's a big ___ between the two phones. (differ)", "c": "difference", "w": [["differment", "\"differment\" is not an English word."], ["different", "\"different\" is an adjective, but the gap needs a noun: \"difference\"."]], "tip": "-er → -ence: differ → difference"}, {"p": "The ___ of the new manager surprised everybody. (appoint)", "c": "appointment", "w": [["appointion", "\"appointion\" is not an English word."], ["appointed", "\"appointed\" is a verb (past form), but the gap needs a noun: \"appointment\"."]], "tip": "-ment: appoint → appointment"}, {"p": "Thank you for your ___ during the difficult times. (kind)", "c": "kindness", "w": [["kindity", "\"kindity\" is not an English word."], ["kindly", "\"kindly\" is an adverb, but the gap needs a noun: \"kindness\"."]], "tip": "-ness: kind → kindness"}, {"p": "Public ___ to the plan was very strong. (oppose)", "c": "opposition", "w": [["opposement", "\"opposement\" is not an English word."], ["opposite", "\"opposite\" is an adjective, but the gap needs a noun: \"opposition\"."]], "tip": "oppose → opposition"}, {"p": "The ___ of the hotel staff made our stay wonderful. (friendly)", "c": "friendliness", "w": [["friendlyness", "Change -y to -i before -ness: friendliness."], ["friend", "\"Friend\" is a person. We need the quality: friendliness."]], "tip": "-ly → -liness: friendly → friendliness"}, {"p": "She has a real ___ for languages. (able)", "c": "ability", "w": [["ableness", "\"ableness\" is not an English word."], ["ably", "\"ably\" is an adverb, but the gap needs a noun: \"ability\"."]], "tip": "able → ability"}, {"p": "Their ___ lasted more than fifty years. (friend)", "c": "friendship", "w": [["friendness", "\"friendness\" is not an English word."], ["friendly", "\"friendly\" is an adjective, but the gap needs a noun: \"friendship\"."]], "tip": "-ship: friend → friendship"}, {"p": "I have no ___ about his honesty. (doubtful)", "c": "doubt", "w": [["doubtfulness", "\"Doubtfulness\" is very rare. The normal noun is \"doubt\"."], ["doubtfully", "\"doubtfully\" is an adverb, but the gap needs a noun: \"doubt\"."]], "tip": "doubtful → doubt"}, {"p": "The ___ of the new law will take time. (introduce)", "c": "introduction", "w": [["introducement", "\"introducement\" is not an English word."], ["introductory", "\"introductory\" is an adjective, but the gap needs a noun: \"introduction\"."]], "tip": "introduce → introduction"}, {"p": "Lack of ___ is the main reason people fail diets. (motivate)", "c": "motivation", "w": [["motivatement", "\"motivatement\" is not an English word."], ["motivated", "\"motivated\" is an adjective, but the gap needs a noun: \"motivation\"."]], "tip": "-ate → -ation: motivate → motivation"}, {"p": "Her ___ was obvious when she heard the news. (happy)", "c": "happiness", "w": [["happyness", "Change -y to -i before -ness: happiness."], ["happily", "\"happily\" is an adverb, but the gap needs a noun: \"happiness\"."]], "tip": "-y → -iness: happy → happiness"}, {"p": "Young people need more ___ fro  "c": "profit", "w": [["profitness", "\"profitness\" is not an English word."], ["profitably", "\"profitably\" is an adverb, but the gap needs a noun: \"profit\"."]], "tip": "profitable → profit"}, {"p": "I'd like to make a ___ about the noise. (complain)", "c": "complaint", "w": [["complainment", "\"complainment\" is not an English word."], ["complaining", "\"complaining\" is a verb (-ing form), but the gap needs a noun: \"complaint\"."]], "tip": "complain → complaint"}, {"p": "She showed great ___ during the crisis. (calm)", "c": "calmness", "w": [["calmity", "\"calmity\" is not an English word."], ["calmly", "\"calmly\" is an adverb, but the gap needs a noun: \"calmness\"."]], "tip": "-ness: calm → calmness"}, {"p": "Her ___ to the job made her the best employee. (commit)", "c": "commitment", "w": [["commission", "\"Commission\" is money paid for selling something. Dedication is \"commitment\"."], ["committed", "\"committed\" is an adjective, but the gap needs a noun: \"commitment\"."]], "tip": "-ment: commit → commitment"}, {"p": "The ___ of the team depends on good communication. (perform)", "c": "performance", "w": [["performation", "\"performation\" is not an English word."], ["performer", "\"Performer\" is a person. We need the act/result: performance."]], "tip": "-ance: perform → performance"}, {"p": "I need more ___ before I can make a decision. (inform)", "c": "information", "w": [["informment", "\"informment\" is not an English word."], ["informative", "\"informative\" is an adjective, but the gap needs a noun: \"information\"."]], "tip": "inform → information"}, {"p": "His ___ for being late was not believable. (explain)", "c": "explanation", "w": [["explainment", "\"explainment\" is not an English word."], ["explaining", "\"explaining\" is a verb (-ing form), but the gap needs a noun: \"explanation\"."]], "tip": "explain → explanation"}, {"p": "The ___ of plastic is a big environmental problem. (pollute)", "c": "pollution", "w": [["pollutement", "\"pollutement\" is not an English word."], ["polluted", "\"polluted\" is an adjective, but the gap needs a noun: \"pollution\"."]], "tip": "pollute → pollution"}, {"p": "There was a long ___ before the vote. (discuss)", "c": "discussion", "w": [["discussment", "\"discussment\" is not an English word."], ["discussed", "\"discussed\" is a verb (past form), but the gap needs a noun: \"discussion\"."]], "tip": "discuss → discussion"}, {"p": "Patience is an important ___ for teachers. (qualify)", "c": "qualification", "w": [["qualifyment", "\"qualifyment\" is not an English word."], ["qualified", "\"qualified\" is an adjective, but the gap needs a noun: \"qualification\"."]], "tip": "qualify → qualification"}, {"p": "She couldn't hide her ___ when she lost. (disappoint)", "c": "disappointment", "w": [["disappointion", "\"disappointion\" is not an English word."], ["disappointed", "\"disappointed\" is an adjective, but the gap needs a noun: \"disappointment\"."]], "tip": "-ment: disappoint → disappointment"}, {"p": "The ___ of the hospital is a five-minute drive away. (enter)", "c": "entrance", "w": [["enterance", "Careful with spelling: \"entrance\", not \"enterance\"."], ["entering", "\"entering\" is a verb (-ing form), but the gap needs a noun: \"entrance\"."]], "tip": "enter → entrance"}, {"p": "The ___ between the two countries is improving. (relate)", "c": "relationship", "w": [["relatement", "\"relatement\" is not an English word."], ["relative", "\"Relative\" is a family member. Connection between people/countries is \"relationship\"."]], "tip": "relate → relationship"}, {"p": "His ___ of the rules got him into trouble. (ignore)", "c": "ignorance", "w": [["ignorement", "\"ignorement\" is not an English word."], ["ignorant", "\"ignorant\" is an adjective, but the gap needs a noun: \"ignorance\"."]], "tip": "ignore → ignorance"}, {"p": "The ___ of the volcano destroyed the village. (erupt)", "c": "eruption", "w": [["eruptment", "\"eruptment\" is not an English word."], ["erupted", "\"erupted\" is a verb (past form), but the gap needs a noun: \"eruption\"."]], "tip": "erupt → eruption"}, {"p": "The ___ said that the hotel was too expensive. (advise)", "c": "adviser", "w": [["advisement", "\"advisement\" is not an English word."], ["advisable", "\"advisable\" is an adjective, but the gap needs a noun for a person: \"adviser\"."]], "tip": "-er for people: advise → adviser"}, {"p": "Several ___ were interviewed for the job. (apply)", "c": "applicants", "w": [["applications", "\"Applications\" are forms. People who apply are \"applicants\"."], ["appliers", "\"appliers\" is not an English word."]], "tip": "apply → applicant (person) / application (form)"}, {"p": "The ___ of their wedding was a big surprise. (announce)", "c": "announcement", "w": [["announcion", "\"announcion\" is not an English word."], ["announcer", "\"Announcer\" is a person. We need the act: announcement."]], "tip": "-ment: announce → announcement"}, {"p": "The ___ of the test was clear to everyone. (difficult)", "c": "difficulty", "w": [["difficultness", "\"difficultness\" is not an English word."], ["difficultly", "\"difficultly\" is not an English word."]], "tip": "difficult → difficulty"}, {"p": "I admire her ___ to tell the truth. (brave)", "c": "bravery", "w": [["braveness", "\"Braveness\" is rare. The normal noun is \"bravery\"."], ["bravely", "\"bravely\" is an adverb, but the gap needs a noun: \"bravery\"."]], "tip": "brave → bravery"}, {"p": "The ___ of English is spreading all over the world. (influential)", "c": "influence", "w": [["influentness", "\"influentness\" is not an English word."], ["influentially", "\"influentially\" is an adverb, but the gap needs a noun: \"influence\"."]], "tip": "influential → influence"}, {"p": "Lack of ___ can make students lose interest. (vary)", "c": "variety", "w": [["variation", "\"Variation\" means a small change. Different kinds of things = \"variety\"."], ["various", "\"various\" is an adjective, but the gap needs a t the gap needs a noun: \"solution\"."]], "tip": "solve → solution"}, {"p": "The ___ of the tower is 300 metres. (high)", "c": "height", "w": [["highness", "\"Highness\" is a royal title. For size we say \"height\"."], ["highly", "\"highly\" is an adverb, but the gap needs a noun: \"height\"."]], "tip": "high → height"}, {"p": "The ___ of the lake is about 40 metres. (deep)", "c": "depth", "w": [["deepness", "\"Deepness\" is rare. For measurement we say \"depth\"."], ["deeply", "\"deeply\" is an adverb, but the gap needs a noun: \"depth\"."]], "tip": "-th: deep → depth"}, {"p": "The ___ of the road is 5 km. (long)", "c": "length", "w": [["longness", "\"longness\" is not an English word."], ["longly", "\"longly\" is not an English word."]], "tip": "-th: long → length"}, {"p": "The ___ of my grandmother made everyone sad. (die)", "c": "death", "w": [["dying", "\"dying\" is a verb (-ing form), but the gap needs a noun: \"death\"."], ["dead", "\"dead\" is an adjective, but the gap needs a noun: \"death\"."]], "tip": "die → death"}, {"p": "Her ___ as a doctor is well known. (skilful)", "c": "skill", "w": [["skilfulness", "\"Skilfulness\" is rare. The normal noun is \"skill\"."], ["skilfully", "\"skilfully\" is an adverb, but the gap needs a noun: \"skill\"."]], "tip": "skilful → skill"}, {"p": "His ___ made the meeting very uncomfortable. (rude)", "c": "rudeness", "w": [["rudity", "\"rudity\" is not an English word."], ["rudely", "\"rudely\" is an adverb, but the gap needs a noun: \"rudeness\"."]], "tip": "-ness: rude → rudeness"}, {"p": "Her ___ of the new rules surprised everyone. (accept)", "c": "acceptance", "w": [["acceptment", "\"acceptment\" is not an English word."], ["acceptable", "\"acceptable\" is an adjective, but the gap needs a noun: \"acceptance\"."]], "tip": "-ance: accept → acceptance"}, {"p": "The ___ of social media has changed how we talk. (popular)", "c": "popularity", "w": [["popularness", "\"popularness\" is not an English word."], ["popularly", "\"popularly\" is an adverb, but the gap needs a noun: \"popularity\"."]], "tip": "-ar → -arity: popular → popularity"}, {"p": "She studied ___ at university. (psychological)", "c": "psychology", "w": [["psychologist", "A \"psychologist\" is a person. The subject is \"psychology\"."], ["psychologically", "\"psychologically\" is an adverb, but the gap needs a noun: \"psychology\"."]], "tip": "subject: psychology · person: psychologist"}, {"p": "He's a famous ___ who works for National Geographic. (photograph)", "c": "photographer", "w": [["photography", "\"Photography\" is the activity/art. The person is a \"photographer\"."], ["photographic", "\"photographic\" is an adjective, but the gap needs a noun for a person: \"photographer\"."]], "tip": "person: photographer · art: photography"}, {"p": "Her ___ was the best in the show. (appear)", "c": "appearance", "w": [["appearence", "Careful with spelling: \"appearance\" with -ance."], ["appearing", "\"appearing\" is a verb (-ing form), but the gap needs a noun: \"appearance\"."]], "tip": "-ance: appear → appearance"}, {"p": "The book has beautiful ___. (illustrate)", "c": "illustrations", "w": [["illustrators", "\"Illustrators\" are people. The pictures are \"illustrations\"."], ["illustration", "\"illustration\" is singular. The sentence needs the plural form \"illustrations\"."]], "tip": "illustrate → illustration(s)"}, {"p": "We asked for ___ at the information desk. (assist)", "c": "assistance", "w": [["assistant", "An \"assistant\" is a person. Help = \"assistance\"."], ["assistence", "Careful with spelling: \"assistance\" with -ance."]], "tip": "-ance: assist → assistance"}, {"p": "I filled in the job ___ online. (apply)", "c": "application", "w": [["applicant", "An \"applicant\" is a person. The form is an \"application\"."], ["appliance", "An \"appliance\" is a machine like a fridge. The form is an \"application\"."]], "tip": "apply → application (form) / applicant (person)"}, {"p": "The ___ of the factory created tement\" is not an English word."], ["popularity", "\"Popularity\" means being liked. The number of people = \"population\"."]], "tip": "populate → population"}, {"p": "The ___ of the film was unexpected. (end)", "c": "ending", "w": [["endment", "\"endment\" is not an English word."], ["endless", "\"endless\" is an adjective, but the gap needs a noun: \"ending\"."]], "tip": "end → ending"}, {"p": "I don't like the ___ of this soup. (taste)", "c": "taste", "w": [["tasteful", "\"tasteful\" is an adjective, but the gap needs a noun: \"taste\"."], ["tasting", "\"tasting\" is a verb (-ing form), but the gap needs a noun: \"taste\"."]], "tip": "taste (verb = noun)"}, {"p": "Good ___ is important in any relationship. (communicate)", "c": "communication", "w": [["communicatement", "\"communicatement\" is not an English word."], ["communicative", "\"communicative\" is an adjective, but the gap needs a noun: \"communication\"."]], "tip": "-ate → -ation: communicate → communication"}, {"p": "We admired the ___ of his work. (original)", "c": "originality", "w": [["originalness", "\"originalness\" is not an English word."], ["originally", "\"originally\" is an adverb, but the gap needs a noun: \"originality\"."]], "tip": "-al → -ality: original → originality"}, {"p": "She spoke with real ___ about her experience. (honest)", "c": "honesty", "w": [["honestness", "\"Honestness\" is not used. The noun is \"honesty\"."], ["honestly", "\"honestly\" is an adverb, but the gap needs a noun: \"honesty\"."]], "tip": "-y: honest → honesty"}, {"p": "The ___ of the volunteers made the event possible. (generous)", "c": "generosity", "w": [["generousness", "\"Generousness\" is rare. The normal noun is \"generosity\"."], ["generously", "\"generously\" is an adverb, but the gap needs a noun: \"generosity\"."]], "tip": "-ous → -osity: generous → generosity"}, {"p": "The ___ in car numbers has caused traffic problems. (increase)", "c": "increase", "w": [["increasement", "\"increasement\" is not an echnologically\" is an adverb, but the gap needs a noun: \"technology\"."]], "tip": "technological → technology"}, {"p": "Her ___ of the problem was very clear. (analyse)", "c": "analysis", "w": [["analysement", "\"analysement\" is not an English word."], ["analyst", "An \"analyst\" is a person. The study of a problem = \"analysis\"."]], "tip": "analyse → analysis (act) / analyst (person)"}, {"p": "There's a strong ___ between diet and health. (connect)", "c": "connection", "w": [["connectment", "\"connectment\" is not an English word."], ["connected", "\"connected\" is an adjective, but the gap needs a noun: \"connection\"."]], "tip": "connect → connection"}, {"p": "The ___ of the hotel room was perfect. (clean)", "c": "cleanliness", "w": [["cleanity", "\"cleanity\" is not an English word."], ["cleanly", "\"cleanly\" is an adverb, but the gap needs a noun: \"cleanliness\"."]], "tip": "clean → cleanliness"}]}, {"id": "w2", "title": "Word formation: adjectives and adverbs", "intro": "Complete the sentence with the correct form of the word in brackets: adjective, adverb or opposite (un- / im- / in- / ir- / il- / dis-).", "box": "-ful / -less · -ous · -able · -ive · -al · -ly · -ed / -ing · un- / im- / in- / ir- / il-", "boxLabel": "Patterns", "items": [{"p": "The local authority has opened a new hospital ___, a five-minute drive from the town. (near)", "c": "nearby", "w": [["nearly", "\"Nearly\" means \"almost\". \"Not far away\" = \"nearby\"."], ["nearness", "\"nearness\" is a noun, but the gap needs an adverb: \"nearby\"."]], "tip": "near → nearby (not far away)"}, {"p": "Everyone was more than ___ to help with the clearing up after the party. (happiness)", "c": "happy", "w": [["happily", "\"happily\" is an adverb, but the gap needs an adjective: \"happy\"."], ["happiness", "\"happiness\" is a noun, but the gap needs an adjective: \"happy\"."]], "tip": "happy to help"}, {"p": "I have to be ___ with you: I read your emails without permission. Sorry! (honesty)", "c": at causes the feeling. A person feels \"surprised\"."], ["surprisingly", "\"surprisingly\" is an adverb, but the gap needs an adjective: \"surprised\"."]], "tip": "-ed = how a person feels"}, {"p": "He drove ___ and nobody was hurt. (care)", "c": "carefully", "w": [["careful", "\"careful\" is an adjective, but the gap needs an adverb: \"carefully\"."], ["carelessly", "\"carelessly\" has the opposite meaning. The sentence needs \"carefully\"."]], "tip": "adverb after a verb: drive carefully"}, {"p": "It's ___ to use your phone while driving. (danger)", "c": "dangerous", "w": [["dangerously", "\"dangerously\" is an adverb, but the gap needs an adjective: \"dangerous\"."], ["endangered", "\"Endangered\" means at risk of disappearing (endangered animals). \"Not safe\" = \"dangerous\"."]], "tip": "-ous: danger → dangerous"}, {"p": "She's very ___. She's always making things. (create)", "c": "creative", "w": [["creation", "\"creation\" is a noun, but the gap needs an adjective: \"creative\"."], ["creatively", "\"creatively\" is an adverb, but the gap needs an adjective: \"creative\"."]], "tip": "-ive: create → creative"}, {"p": "His answer was completely ___. It made no sense. (logic)", "c": "illogical", "w": [["logical", "\"Logical\" means it makes sense. The sentence says it made NO sense, so we need \"illogical\"."], ["logically", "\"logically\" is an adverb, but the gap needs an adjective: \"illogical\"."]], "tip": "il- before l: illogical"}, {"p": "That's ___! You can't fly without wings. (possible)", "c": "impossible", "w": [["possible", "\"Possible\" means it can happen. The sentence says it can't, so we need \"impossible\"."], ["unpossible", "\"unpossible\" is not an English word."]], "tip": "im- before p: impossible"}, {"p": "The instructions were ___, so I didn't know what to do. (clear)", "c": "unclear", "w": [["clearly", "\"clearly\" is an adverb, but the gap needs an adjective: \"unclear\"."], ["clear", "\"Clear\" means easy to understand. The person didn't know what to do, so we need \"unclear\"."]], "tip": "un- + adjective: unclear"}, {"p": "It's ___ to leave food on your plate in some countries. (polite)", "c": "impolite", "w": [["unpolite", "\"unpolite\" is not an English word."], ["politely", "\"politely\" is an adverb, but the gap needs an adjective: \"impolite\"."]], "tip": "im- + polite: impolite"}, {"p": "She's a very ___ person. She never tells lies. (honesty)", "c": "honest", "w": [["dishonest", "\"dishonest\" has the opposite meaning. The sentence needs \"honest\"."], ["honestly", "\"honestly\" is an adverb, but the gap needs an adjective: \"honest\"."]], "tip": "honest ≠ dishonest"}, {"p": "He's so ___. He never waits for anything. (patience)", "c": "impatient", "w": [["unpatient", "\"unpatient\" is not an English word."], ["patiently", "\"patiently\" is an adverb, but the gap needs an adjective: \"impatient\"."]], "tip": "im- + patient: impatient"}, {"p": "The museum is ___ for children; there's a lot to touch and play with. (suit)", "c": "suitable", "w": [["suitably", "\"suitably\" is an adverb, but the gap needs an adjective: \"suitable\"."], ["unsuitable", "\"unsuitable\" has the opposite meaning. The sentence needs \"suitable\"."]], "tip": "-able: suit → suitable"}, {"p": "She sings ___. Everyone loves her voice. (beauty)", "c": "beautifully", "w": [["beautiful", "\"beautiful\" is an adjective, but the gap needs an adverb: \"beautifully\"."], ["beautician", "A \"beautician\" is a person who does beauty treatments. \"In a beautiful way\" = \"beautifully\"."]], "tip": "adverb after a verb: sing beautifully"}, {"p": "I'm ___ about my exam results. (worry)", "c": "worried", "w": [["worrying", "\"Worrying\" describes something that causes worry. A person feels \"worried\"."], ["worriedly", "\"worriedly\" is an adverb, but the gap needs an adjective: \"worried\"."]], "tip": "-ed = how a person feels"}, {"p": "That was a very ___ experience. I'll never forget it. (memory)", "c": "memorable", "w": [["memorial" (use)", "c": "useless", "w": [["useful", "\"useful\" has the opposite meaning. The sentence needs \"useless\"."], ["uselessly", "\"uselessly\" is an adverb, but the gap needs an adjective: \"useless\"."]], "tip": "-less = without use: useless"}, {"p": "Our teacher explained the rule very ___. (clear)", "c": "clearly", "w": [["clear", "\"clear\" is an adjective, but the gap needs an adverb: \"clearly\"."], ["unclear", "\"unclear\" has the opposite meaning. The sentence needs \"clearly\"."]], "tip": "adverb after a verb: explain clearly"}, {"p": "It's ___ that she will come. She's very busy. (likely)", "c": "unlikely", "w": [["likely", "\"Likely\" means it will probably happen. She's busy, so we need \"unlikely\"."], ["likelihood", "\"likelihood\" is a noun, but the gap needs an adjective: \"unlikely\"."]], "tip": "un- + likely: unlikely"}, {"p": "The weather was ___ hot for October. (usual)", "c": "unusually", "w": [["unusual", "\"unusual\" is an adjective, but the gap needs an adverb: \"unusually\"."], ["usually", "\"Usually\" means \"normally\". \"More than normal\" = \"unusually\"."]], "tip": "adverb before an adjective: unusually hot"}, {"p": "She's ___ about her new job. (enthusiasm)", "c": "enthusiastic", "w": [["enthusiastically", "\"enthusiastically\" is an adverb, but the gap needs an adjective: \"enthusiastic\"."], ["enthusiast", "An \"enthusiast\" is a person. We need the adjective \"enthusiastic\"."]], "tip": "enthusiasm → enthusiastic"}, {"p": "I'm ___ for the mistake. It was my fault. (response)", "c": "responsible", "w": [["responsive", "\"Responsive\" means reacting quickly. \"My fault\" = \"responsible\"."], ["irresponsible", "\"irresponsible\" has the opposite meaning. The sentence needs \"responsible\"."]], "tip": "response → responsible"}, {"p": "Leaving a child alone at home is very ___. (response)", "c": "irresponsible", "w": [["unresponsible", "\"unresponsible\" is not an English word."], ["responsible", "\"Responsible\" is a good quality. Leaving a child alone is bad, so we need \"irresponsible\"."]], "tip": "ir- + responsible: irresponsible"}, {"p": "The new phone is ___ cheap. (amazing)", "c": "amazingly", "w": [["amazing", "\"amazing\" is an adjective, but the gap needs an adverb: \"amazingly\"."], ["amazed", "\"amazed\" is an adjective, but the gap needs an adverb: \"amazingly\"."]], "tip": "adverb before an adjective: amazingly cheap"}, {"p": "The food in this café is always ___. (delicacy)", "c": "delicious", "w": [["deliciously", "\"deliciously\" is an adverb, but the gap needs an adjective: \"delicious\"."], ["delicate", "\"Delicate\" means easily broken. Tasty food is \"delicious\"."]], "tip": "delicious = very tasty"}, {"p": "He was ___ injured in the accident. (serious)", "c": "seriously", "w": [["serious", "\"serious\" is an adjective, but the gap needs an adverb: \"seriously\"."], ["seriousness", "\"seriousness\" is a noun, but the gap needs an adverb: \"seriously\"."]], "tip": "adverb before a past participle: seriously injured"}, {"p": "Don't be so ___. Share your sweets with your brother! (self)", "c": "selfish", "w": [["selfless", "\"Selfless\" means caring about others—the opposite. \"Only thinking of yourself\" = \"selfish\"."], ["selfishly", "\"selfishly\" is an adverb, but the gap needs an adjective: \"selfish\"."]], "tip": "-ish: self → selfish"}, {"p": "The bus is ___ late. I'm not surprised. (usual)", "c": "usually", "w": [["unusually", "\"Unusually\" means \"not normally\". The speaker isn't surprised, so it's \"usually\"."], ["usual", "\"usual\" is an adjective, but the gap needs an adverb: \"usually\"."]], "tip": "usually = normally"}, {"p": "The results were ___. Nobody expected them. (expect)", "c": "unexpected", "w": [["expected", "\"Expected\" means people thought it would happen. Nobody expected it, so we need \"unexpected\"."], ["unexpectedly", "\"unexpectedly\" is an adverb, but the gap needs an adjective: \"unexpected\"."]], "tip": "un- + expected: unexpected"}, {"p": "He ___ agreed to help us. (kind)", "c": "kindly", "w": [["kind", "\"kind\" is an adjective, but the gap needs an adverb: \"kindly\"."], ["kindness", "\"kindness\" is a noun, but the gap needs an adverb: \"kindly\"."]], "tip": "adverb before a verb: kindly agreed"}, {"p": "Your plan is very ___. It won't work. (reality)", "c": "unrealistic", "w": [["realistic", "\"Realistic\" means it could work. It won't work, so we need \"unrealistic\"."], ["really", "\"really\" is an adverb, but the gap needs an adjective: \"unrealistic\"."]], "tip": "un- + realistic: unrealistic"}, {"p": "Online lessons are very ___ for busy people. (convenience)", "c": "convenient", "w": [["conveniently", "\"conveniently\" is an adverb, but the gap needs an adjective: \"convenient\"."], ["inconvenient", "\"inconvenient\" has the opposite meaning. The sentence needs \"convenient\"."]], "tip": "convenience → convenient"}, {"p": "The meeting was ___ early, at 6 a.m. It was hard to get there. (convenient)", "c": "inconveniently", "w": [["conveniently", "\"Conveniently\" means in a helpful way. A 6 a.m. meeting was difficult, so we need \"inconveniently\"."], ["inconvenient", "\"inconvenient\" is an adjective, but the gap needs an adverb: \"inconveniently\"."]], "tip": "in- + convenient + -ly: inconveniently"}, {"p": "The test was ___ easy. Everyone passed. (relative)", "c": "relatively", "w": [["relative", "\"relative\" is an adjective, but the gap needs an adverb: \"relatively\"."], ["relation", "\"relation\" is a noun, but the gap needs an adverb: \"relatively\"."]], "tip": "adverb before an adjective: relatively easy"}, {"p": "It's ___ to sleep at least seven hours a night. (advice)", "c": "advisable", "w": [["advisory", "\"Advisory\" means giving advice (an advisory committee). \"A good idea\" = \"advisable\"."], ["advisably", "\"advisably\" is an adverb, but the gap needs an adjective: \"advisable\"."]], "tip": "advice → advisable"}, {"p": "She looked ___ at the beautiful view. (dream)", "c": "dreamily", "w": [["dreamy", "\"dreamy\" is an adjective, but the gap needs an adverb: \"dreamily\"."], ["dreamless", "\"Dreamless\" means without dreams (a dreamless sleep). We need the adverb \"dreamily\"."]], "tip": "-y → -ily: dreamy → dreamily"}, {"p": "The new rules are ___ to everyone. (accept)", "c": "acceptable", "w": [["unacceptable", "\"unacceptable\" has the opposite meaning. The sentence needs \"acceptable\"."], ["acceptably", "\"acceptably\" is an adverb, but the gap needs an adjective: \"acceptable\"."]], "tip": "-able: accept → acceptable"}, {"p": "Shouting at customers is completely ___. (accept)", "c": "unacceptable", "w": [["acceptable", "\"acceptable\" has the opposite meaning. The sentence needs \"unacceptable\"."], ["inacceptable", "\"inacceptable\" is not an English word."]], "tip": "un- + acceptable: unacceptable"}, {"p": "He spoke so ___ that nobody could hear him. (quiet)", "c": "quietly", "w": [["quiet", "\"quiet\" is an adjective, but the gap needs an adverb: \"quietly\"."], ["quietness", "\"quietness\" is a noun, but the gap needs an adverb: \"quietly\"."]], "tip": "adverb after a verb: speak quietly"}, {"p": "She's very ___. She always does what she promises. (rely)", "c": "reliable", "w": [["unreliable", "\"unreliable\" has the opposite meaning. The sentence needs \"reliable\"."], ["reliably", "\"reliably\" is an adverb, but the gap needs an adjective: \"reliable\"."]], "tip": "-able: rely → reliable"}, {"p": "The bus service here is very ___. It's often late. (rely)", "c": "unreliable", "w": [["reliable", "\"reliable\" has the opposite meaning. The sentence needs \"unreliable\"."], ["irreliable", "\"irreliable\" is not an English word."]], "tip": "un- + reliable: unreliable"}, {"p": "I'm ___ grateful for your help. (deep)", "c": "deeply", "w": [["deep", "\"deep\" is an adjective, but the gap needs an adverb: \"deeply\"."], ["depth", "\"depth\" is a noun, but the gap needs an adverb: \"deeply\"."]], "tip": "adverb before an adjective: deeply grateful"}, {"p": "He's ___ in history. He reads about it all the time. (interest)", "c": "interested", "w": [["interesting", "\"Interesting\" describes the thing. A person who likes history is \"interested\" in it."], ["interestingly", "\"interestingly\" is an adverb, but the gap needs an adjective: \"interested\"."]], "tip": "interested in + noun"}, {"p": "This book is really ___. (interest)", "c": "interesting", "w": [["interested", "\"Interested\" describes how a person feels. A book causes the feeling, so it is \"interesting\"."], ["interestingly", "\"interestingly\" is an adverb, but the gap needs an adjective: \"interesting\"."]], "tip": "-ing = causes the feeling"}, {"p": "The children played ___ in the garden. (happy)", "c": "happily", "w": [["happy", "\"happy\" is an adjective, but the gap needs an adverb: \"happily\"."], ["happiness", "\"happiness\" is a noun, but the gap needs an adverb: \"happily\"."]], "tip": "adverb after a verb: play happily"}, {"p": "The weather was ___. It rained all week. (terror)", "c": "terrible", "w": [["terribly", "\"terribly\" is an adverb, but the gap needs an adjective: \"terrible\"."], ["terrified", "\"Terrified\" means very afraid. Very bad weather is \"terrible\"."]], "tip": "terror → terrible"}, {"p": "I'm ___ sorry for being late. (terrible)", "c": "terribly", "w": [["terrible", "\"terrible\" is an adjective, but the gap needs an adverb: \"terribly\"."], ["terrified", "\"terrified\" is an adjective, but the gap needs an adverb: \"terribly\"."]], "tip": "adverb before an adjective: terribly sorry"}, {"p": "The city is ___ crowded in summer. (extreme)", "c": "extremely", "w": [["extreme", "\"extreme\" is an adjective, but the gap needs an adverb: \"extremely\"."], ["extremity", "\"extremity\" is a noun, but the gap needs an adverb: \"extremely\"."]], "tip": "adverb before an adjective: extremely crowded"}, {"p": "The ___ part of the job is meeting new people. (enjoy)", "c": "enjoyable", "w": [["enjoyed", "\"enjoyed\" is a verb (past form), but the gap needs an adjective: \"enjoyable\"."], ["enjoyably", "\"enjoyably\" is an adverb, but the gap needs an adjective: \"enjoyable\"."]], "tip": "-able: enjoy → enjoyable"}, {"p": "He's ___ shy. He never speaks in class. (incredible)", "c": "incredibly", "w": [["incredible", "\"incredible\" is an adjective, but the gap needs an adverb: \"incredibly\"."], ["incredulous", "\"Incredulous\" means not able to believe something. \"Very\" = \"incredibly\"."]], "tip": "adverb before an adjective: incredibly shy"}, {"p": "She was ___ when she won the lottery. (excite)", "c": "excited", "w": [["exciting", "\"Exciting\" describes the thing. A person feels \"excited\"."], ["excitedly", "\"excitedly\" is an adverb, but the gap needs an adjective: \"excited\"."]], "tip": "-ed = how a person feels"}, {"p": "Climbing mountains is very ___. (excite)", "c": "exciting", "w": [["excited", "\"Excited\" describes how a person feels. An activity that causes the feeling is \"exciting\"."], ["excitement", "\"excitement\" is a noun, but the gap needs an adjective: \"exciting\"."]], "tip": "-ing = causes the feeling"}, {"p": "He answered all the questions ___. (correct)", "c": "correctly", "w": [["correct", "\"correct\" is an adjective, but the gap needs an adverb: \"correctly\"."], ["incorrectly", "\"incorrectly\" has the opposite meaning. The sentence needs \"correctly\"."]], "tip": "adverb after a verb: answer correctly"}, {"p": "Your answer is ___. Please try again. (correct)", "c": "incorrect", "w": [["uncorrect", "\"uncorrect\" is not an English word."], ["incorrectly", "\"incorrectly\" is an adverb, but the gap needs an adjective: \"incorrect\"."]], "tip": "in- + correct: incorrect"}, {"p": "The hotel staff were very ___. (help)", "c": "helpful", "w": [["helpless", "\"Helpless\" means unable to help yourself. Staff who help = \"helpful\"."], ["helpfully", "\"helpfully\" is an adverb, but the gap needs an adjective: \"helpful\"."]], "tip": "-ful: help → helpful"}, {"p": "The prices here are ___ high. (reason)", "c": "unreasonably", "w": [["reasonably", "\"Reasonably\" means \"fairly / acceptably\". \"Too high\" = \"unreasonably high\"."], ["unreasonable", "\"unreasonable\" is an adjective, but the gap needs an adverb: \"unreasonably\"."]], "tip": "adverb before an adjective: unreasonably high"}, {"p": "This is a ___ price for such a good laptop. (reason)", "c": "reasonable", "w": [["reasonably", "\"reasonably\" is an adverb, but the gap needs an adjective: \"reasonable\"."], ["unreasonable", "\"unreasonable\" has the opposite meaning. The sentence needs \"reasonable\"."]], "tip": "-able: reason → reasonable"}, {"p": "It's ___ that we finish on time. (essence)", "c": "essential", "w": [["essentially", "\"essentially\" is an adverb, but the gap needs an adjective: \"essential\"."], ["essentialness", "\"essentialness\" is not an English word."]], "tip": "essence → essential"}, {"p": "The children were ___ quiet during the film. (remark)", "c": "remarkably", "w": [["remarkable", "\"remarkable\" is an adjective, but the gap needs an adverb: \"remarkably\"."], ["remarked", "\"remarked\" is a verb (past form), but the gap needs an adverb: \"remarkably\"."]], "tip": "adverb before an adjective: remarkably quiet"}, {"p": "His story was ___. Nobody believed it. (believe)", "c": "unbelievable", "w": [["believable", "\"Believable\" means people can believe it. Nobody believed it, so we need \"unbelievable\"."], ["unbelievably", "\"unbelievably\" is an adverb, but the gap needs an adjective: \"unbelievable\"."]], "tip": "un- + believable: unbelievable"}, {"p": "It's ___ hot today! (believe)", "c": "unbelievably", "w": [["unbelievable", "\"unbelievable\" is an adjective, but the gap needs an adverb: \"unbelievably\"."], ["believably", "\"believably\" is an adverb, but the gap needs an adverb: \"unbelievably\"."]], "tip": "adverb before an adjective: unbelievably hot"}, {"p": "My grandfather is very ___. He knows a lot about life. (wisdom)", "c": "wise", "w": [["wisely", "\"wisely\" is an adverb, but the gap needs an adjective: \"wise\"."], ["wiseness", "\"wiseness\" is not an English word."]], "tip": "wisdom → wise"}, {"p": "She spent her money ___. (wisdom)", "c": "wisely", "w": [["wise", "\"wise\" is an adjective, but the gap needs an adverb: \"wisely\"."], ["unwisely", "\"unwisely\" has the opposite meaning. The sentence needs \"wisely\"."]], "tip": "adverb after a verb: spend wisely"}, {"p": "The streets were ___ after midnight. (peace)", "c": "peaceful", "w": [["peacefully", "\"peacefully\" is an adverb, but the gap needs an adjective: \"peaceful\"."], ["peaceless", "\"peaceless\" is not an English word."]], "tip": "-ful: peace → peaceful"}, {"p": "I felt ___ after the long run. (exhaust)", "c": "exhausted", "w": [["exhausting", "\"Exhausting\" describes the activity. A person feels \"exhausted\"."], ["exhaustion", "\"exhaustion\" is a noun, but the gap needs an adjective: \"exhausted\"."]], "tip": "-ed = how a person feels"}, {"p": "His speech was ___. People were crying. (emotion)", "c": "emotional", "w": [["emotionally", "\"emotionally\" is an adverb, but the gap needs an adjective: \"emotional\"."], ["emotionless", "\"Emotionless\" means without feelings. People crying shows the speech was \"emotional\"."]], "tip": "-al: emotion → emotional"}, {"p": "It's ___ to drink water from this river. (safe)", "c": "unsafe", "w": [["safe", "\"Safe\" means not dangerous. The sentence warns us, so we need \"unsafe\"."], ["safely", "\"safely\" is an adverb, but the gap needs an adjective: \"unsafe\"."]], "tip": "un- + safe: unsafe"}, {"p": "Please drive ___. (safe)", "c": "safely", "w": [["safe", "\"safe\" is an adjective, but the gap needs an adverb: \"safely\"."], ["safety", "\"safety\" is a noun, but the gap needs an adverb: \"safely\"."]], "tip": "adverb after a verb: drive safely"}, {"p": "He made a ___ mistake that cost the company millions. (cost)", "c": "costly", "w": [["costful", "\"costful\" is not an English word."], ["costing", "\"costing\" is a verb (-ing form), but the gap needs an adjective: \"costly\"."]], "tip": "cost → costly (expensive)"}, {"p": "The village is ___ beautiful in spring. (particular)", "c": "particularly", "w": [["particular", "\"particular\" is an adjective, but the gap needs an adverb: \"particularly\"."], ["particularity", "\"particularity\" is a noun, but the gap needs an adverb: \"particularly\"."]], "tip": "adverb before an adjective: particularly beautiful"}, {"p": "The weather was ___ cold, so we stayed inside. (bitter)", "c": "bitterly", "w": [["bitter", "\"bitter\" is an adjective, but the gap needs an adverb: \"bitterly\"."], ["bitterness", "\"bitterness\" is a noun, but the gap needs an adverb: \"bitterly\"."]], "tip": "bitterly cold (collocation)"}, {"p": "The two brothers look ___ different. (complete)", "c": "completely", "w": [["complete", "\"complete\" is an adjective, but the gap needs an adverb: \"completely\"."], ["incomplete", "\"incomplete\" has the opposite meaning. The sentence needs \"completely\"."]], "tip": "adverb before an adjective: completely different"}, {"p": "Your homework is ___. Please finish it. (complete)", "c": "incomplete", "w": [["uncomplete", "\"uncomplete\" is not an English word."], ["completely", "\"completely\" is an adverb, but the gap needs an adjective: \"incomplete\"."]], "tip": "in- + complete: incomplete"}, {"p": "The hotel was ___ located near the beach. (perfect)", "c": "perfectly", "w": [["perfect", "\"perfect\" is an adjective, but the gap needs an adverb: \"perfectly\"."], ["imperfect", "\"imperfect\" has the opposite meaning. The sentence needs \"perfectly\"."]], "tip": "adverb before a past participle: perfectly located"}, {"p": "The children were ___ when they saw the clown. (delight)", "c": "delighted", "w": [["delightful", "\"Delightful\" describes the thing that gives pleasure. A person feels \"delighted\"."], ["delightfully", "\"delightfully\" is an adverb, but the gap needs an adjective: \"delighted\"."]], "tip": "-ed = how a person feels"}, {"p": "We had a ___ evening by the lake. (delight)", "c": "delightful", "w": [["delighted", "\"Delighted\" describes how a person feels. An evening that gives pleasure is \"delightful\"."], ["delightfully", "\"delightfully\" is an adverb, but the gap needs an adjective: \"delightful\"."]], "tip": "-ful: delight → delightful"}, {"p": "The shop assistant was ___ rude. (shock)", "c": "shockingly", "w": [["shocking", "\"shocking\" is an adjective, but the gap needs an adverb: \"shockingly\"."], ["shocked", "\"shocked\" is an adjective, but the gap needs an adverb: \"shockingly\"."]], "tip": "adverb before an adjective: shockingly rude"}, {"p": "It's ___ to work for twelve hours a day. (health)", "c": "unhealthy", "w": [["healthy", "\"Healthy\" is good for you. Twelve hours a day is bad for you, so we need \"unhealthy\"."], ["healthily", "\"healthily\" is an adverb, but the gap needs an adjective: \"unhealthy\"."]], "tip": "un- + healthy: unhealthy"}, {"p": "Try to eat more ___. (health)", "c": "healthily", "w": [["healthy", "\"healthy\" is an adjective, but the gap needs an adverb: \"healthily\"."], ["health", "\"health\" is a noun, but the gap needs an adverb: \"healthily\"."]], "tip": "adverb after a verb: eat healthily"}, {"p": "She ___ refused to answer the question. (polite)", "c": "politely", "w": [["polite", "\"polite\" is an adjective, but the gap needs an adverb: \"politely\"."], ["impolitely", "\"impolitely\" has the opposite meaning. The sentence needs \"politely\"."]], "tip": "adverb before a verb: politely refused"}, {"p": "He has an ___ number of shoes—more than 200 pairs! (believe)", "c": "unbelievable", "w": [["unbelievably", "\"unbelievably\" is an adverb, but the gap needs an adjective: \"unbelievable\"."], ["believable", "\"believable\" has the opposite meaning. The sentence needs \"unbelievable\"."]], "tip": "un- + believable: unbelievable"}, {"p": "I'm ___ busy this cessible\"."]], "tip": "in- + accessible: inaccessible"}]}, {"id": "w3", "title": "Academic words", "intro": "Choose the correct word from the box (in the right form).", "box": "develop / discover / significant / approximately / investigate / evidence / estimate / conclude / decline / impact / survey / benefit / require / indicate / analyse / factor / reliable / aspect / previous / consequence", "boxLabel": "Words", "items": [{"p": "Online learning has seen a ___ rise in popularity over the past few years.", "c": "significant", "w": [["approximate", "\"approximately\" means about, not exactly. It doesn't fit this sentence."], ["previous", "\"previous\" means happening before, earlier. It doesn't fit this sentence."]], "tip": "significant = large or important enough to notice"}, {"p": "One important ___ was the introduction of interactive platforms.", "c": "development", "w": [["discovery", "\"discover\" means to find something for the first time. It doesn't fit this sentence."], ["survey", "\"survey\" means a set of questions you ask many people to learn their opinions. It doesn't fit this sentence."]], "tip": "develop = to grow or create something new over time"}, {"p": "Researchers continue to ___ how technology affects concentration.", "c": "investigate", "w": [["decline", "\"decline\" means to become smaller or fewer. It doesn't fit this sentence."], ["require", "\"require\" means to need something, or make it necessary. It doesn't fit this sentence."]], "tip": "investigate = to study a problem or crime carefully to find the truth"}, {"p": "It is estimated that ___ half of all university students now use online learning.", "c": "approximately", "w": [["significantly", "\"significant\" means large or important enough to notice. It doesn't fit this sentence."], ["previously", "\"previous\" means happening before, earlier. It doesn't fit this sentence."]], "tip": "approximately = about, not exactly"}, {"p": "Penicillin was ___ by Alexander Fleming in 1928.", "c": "  ["To sum up", "\"To sum up\" means used to give a short summary at the end. It doesn't fit this sentence."]], "tip": "May I say something? = a polite way to ask to join the conversation"}, {"p": "Your colleague is talking, but you must tell everyone the taxi has arrived: \"___ The taxi is here.\"", "c": "May I just interrupt for a second?", "w": [["In my view", "\"In my view\" means used to give your opinion. It doesn't fit this sentence."], ["For example", "\"For example\" means used to give an example. It doesn't fit this sentence."]], "tip": "May I just interrupt for a second? = a polite way to interrupt someone briefly"}, {"p": "You are in a formal seminar and want to add a remark: \"___ in the second report.\"", "c": "I'd like to comment on something", "w": [["Sorry, go ahead", "\"Sorry, go ahead\" means used to let the other person continue speaking. It doesn't fit this sentence."], ["You've got a point", "\"You've got a point\" means used to accept that someone is partly right. It doesn't fit this sentence."]], "tip": "I'd like to comment on something = a formal way to say you want to add a remark"}, {"p": "You need to stop the speaker politely: \"___, but there's a phone call for you.\"", "c": "Excuse me for interrupting", "w": [["To sum up", "\"To sum up\" means used to give a short summary at the end. It doesn't fit this sentence."], ["I couldn't agree more", "\"I couldn't agree more\" means used to agree completely. It doesn't fit this sentence."]], "tip": "Excuse me for interrupting = a polite apology before you interrupt"}, {"p": "In a debate, you want to add your point now: \"___ Not everyone can afford a car.\"", "c": "Can I say something here?", "w": [["Sorry, go ahead", "\"Sorry, go ahead\" means used to let the other person continue speaking. It doesn't fit this sentence."], ["To sum up", "\"To sum up\" means used to give a short summary at the end. It doesn't fit this sentence."]], "tip": "Can I say something here? = a polite way to ask to add your point now"}, {"p": "Your friend says plastic bags should be banned. You agree 100%: \"___ They're terrible for the sea.\"", "c": "I couldn't agree more", "w": [["I'm afraid I disagree", "\"I'm afraid I disagree\" means a polite but clear way to disagree. It doesn't fit this sentence."], ["Could you clarify what you mean?", "\"Could you clarify what you mean?\" means used to ask someone to explain more clearly. It doesn't fit this sentence."]], "tip": "I couldn't agree more = used to agree completely"}, {"p": "Your boss says the team needs more training. You totally agree: \"___ We really need it.\"", "c": "That's exactly what I think", "w": [["I'm not sure I agree", "\"I'm not sure I agree\" means a soft way to disagree. It doesn't fit this sentence."], ["Sorry, I didn't catch that", "\"Sorry, I didn't catch that\" means used when you didn't hear or understand. It doesn't fit this sentence."]], "tip": "That's exactly what I think = used to agree completely"}, {"p": "Your friend says phones distract students. You partly agree: \"___, but they can also help them learn.\"", "c": "You've got a point", "w": [["I couldn't agree more", "\"I couldn't agree more\" means used to agree completely. It doesn't fit this sentence."], ["To sum up", "\"To sum up\" means used to give a short summary at the end. It doesn't fit this sentence."]], "tip": "You've got a point = used to accept that someone is partly right"}, {"p": "Someone says homework should be banned. You softly disagree: \"___ Homework helps us practise.\"", "c": "I'm not sure I agree", "w": [["That's exactly what I think", "\"That's exactly what I think\" means used to agree completely. It doesn't fit this sentence."], ["Sorry, go ahead", "\"Sorry, go ahead\" means used to let the other person continue speaking. It doesn't fit this sentence."]], "tip": "I'm not sure I agree = a soft way to disagree"}, {"p": "Your colleague says remote work is better. You understand but disagree: \"___ people need to meet face to face.\"", "c": "I see what you mean, but", "w": [["I couldn't agree more", "\"I couldn't agree more\" means used to agree completely. It doesn't fit this sentence."], ["For example", "\"For example\" means used to give an example. It doesn't fit this sentence."]], "tip": "I see what you mean, but = used to accept someone's view and then disagree"}, {"p": "In a formal debate, you clearly disagree: \"___ The plan is too expensive.\"", "c": "I'm afraid I disagree", "w": [["That's exactly what I think", "\"That's exactly what I think\" means used to agree completely. It doesn't fit this sentence."], ["May I say something?", "\"May I say something?\" means a polite way to ask to join the conversation. It doesn't fit this sentence."]], "tip": "I'm afraid I disagree = a polite but clear way to disagree"}, {"p": "You give your opinion in an essay discussion: \"___, social media does more harm than good.\"", "c": "In my view", "w": [["Sorry, go ahead", "\"Sorry, go ahead\" means used to let the other person continue speaking. It doesn't fit this sentence."], ["Could you clarify what you mean?", "\"Could you clarify what you mean?\" means used to ask someone to explain more clearly. It doesn't fit this sentence."]], "tip": "In my view = used to give your opinion"}, {"p": "You give your personal opinion strongly: \"___, the new rule is unfair.\"", "c": "As far as I'm concerned", "w": [["Excuse me for interrupting", "\"Excuse me for interrupting\" means a polite apology before you interrupt. It doesn't fit this sentence."], ["Sorry, I didn't catch that", "\"Sorry, I didn't catch that\" means used when you didn't hear or understand. It doesn't fit this sentence."]], "tip": "As far as I'm concerned = used to give your personal opinion"}, {"p": "You want to know your friend's opinion: \"___ the new teacher?\"", "c": "What do you think about", "w": [["Let me put it another way", "\"Let me put it another way\" means used to explain the same idea with different words. It doesn't fit th
