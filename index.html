function Progress(){
  const sum=topics=>{let m=0,t=0;topics.forEach(x=>{m+=masteredIn(x);t+=x.items.length});return[m,t]};
  const [gm,gt]=sum(D.grammar),[vm,vt]=sum(D.vocab);
  const sp=D.speaking.filter(c=>P.spoken[c.id]).length;
  const pct=(a,b)=>b?Math.round(a/b*100):0;
  const tile=(label,a,b,unit)=>`<div class="tile"><span class="label">${label}</span><span class="big">${pct(a,b)}%</span><div class="meter"><i style="width:${pct(a,b)}%"></i></div><span class="mono" style="font-size:12px;color:var(--muted)">${a} / ${b} ${unit}</span></div>`;
  const row=t=>{const m=masteredIn(t),n=t.items.length,tr=P.tries[t.id]||0,b=P.best[t.id];
    let pill=(tr===0&&m===0)?'<span class="pill go">Start</span>':m===n?'<span class="pill ok">Mastered</span>':(tr>0&&m/n<.6?'<span class="pill warn">Needs work</span>':'<span class="pill">In progress</span>');
    return `<div class="prow"><button data-go="${t.id}" class="t">${esc(t.title)}<small>${m}/${n} correct · ${tr} ${tr===1?'try':'tries'}</small></button><div class="meter" aria-hidden="true"><i style="width:${pct(m,n)}%"></i></div><button data-go="${t.id}">${pill}</button></div>`};
  const any=Object.keys(P.tries).length||Object.keys(P.mastered).length||sp;
  view.innerHTML=`<div style="display:flex;flex-direction:column;gap:16px">
    <div class="prog-hero">${tile('Grammar',gm,gt,'questions')}${tile('Vocabulary',vm,vt,'questions')}${tile('Speaking',sp,10,'cards practised')}</div>
    ${any?'':'<div class="empty">No progress yet. Pick a topic below to start. A question counts as done once you answer it correctly.</div>'}
    <div class="sec-h"><span class="label">Grammar topics</span><button class="linkbtn" data-weak="grammar">Practise my weak grammar</button></div>
    <div class="rows">${D.grammar.map(row).join('')}</div>
    <div class="sec-h"><span class="label">Vocabulary topics</span><button class="linkbtn" data-weak="vocab">Practise my weak vocabulary</button></div>
    <div class="rows">${D.vocab.map(row).join('')}</div>
    <div class="sec-h"><span class="label">Speaking cards</span><span class="mono" style="font-size:12px;color:var(--muted)">${sp}/10 practised</span></div>
    <div class="cards">${D.speaking.map(c=>`<button class="scard${P.spoken[c.id]?' done':''}" data-card="${c.id}"><span class="L">${c.id}</span><span class="tp">${esc(c.topic)}</span>${P.spoken[c.id]?'<span class="pill ok" style="align-self:flex-start">Practised</span>':''}</button>`).join('')}</div>
    <div style="display:flex;justify-content:flex-end"><button class="small-btn" id="reset">Reset all progress</button></div></div>`;
  view.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const id=b.dataset.go,sec=id[0]==='g'?'grammar':'vocab';curTopic[sec]=id;store.set(sec==='grammar'?'tg':'tv',id);setTab(sec)});
  view.querySelectorAll('[data-weak]').forEach(b=>b.onclick=()=>{const sec=b.dataset.weak;setTab(sec);Quiz.weak(sec)});
  view.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{setTab('speaking');Speaking.open(b.dataset.card)});
  const r=document.getElementById('reset');r.onclick=()=>{if(r.dataset.c){P={mastered:{},best:{},tries:{},spoken:{}};save();Progress()}else{r.dataset.c=1;r.textContent='Tap again to delete all progress'}};
}

/* ---------- SECTION (grammar / vocab) ---------- */
function Section(sec){
  const S=SECTIONS[sec];
  view.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">
    <section class="picker"><div class="picker-head"><span class="label">${S.name} topics</span><button class="linkbtn" id="weakBtn">Practise my weak questions</button></div>
    <div class="chips" id="chips"></div></section>
    <section class="picker"><div class="picker-head"><span class="label">Sets of 20 questions</span></div><div class="chips" id="sets"></div></section>
    <div id="stage"></div></div>`;
  const chips=()=>{document.getElementById('chips').innerHTML=S.topics.map((t,i)=>{const m=masteredIn(t),n=t.items.length;
    return `<button class="chip" data-id="${t.id}" aria-pressed="${curTopic[sec]===t.id}">${i+1}. ${esc(t.title)} <small>${m}/${n}</small></button>`}).join('')};
  const sets=()=>{const t=topicById(curTopic[sec])||S.topics[0],k=Math.ceil(t.items.length/SET),cur=Quiz.weakMode?-1:setFor(t);
    document.getElementById('sets').innerHTML=Array.from({length:k},(_,s)=>{const a=s*SET,b=Math.min(a+SET,t.items.length),m=t.items.slice(a,b).filter((_,j)=>P.mastered[t.id+':'+(a+j)]).length;
      return `<button class="chip" data-s="${s}" aria-pressed="${cur===s}">Set ${s+1} <small>${m}/${b-a}</small></button>`}).join('')};
  const refresh=()=>{chips();sets()};
  chips(); Quiz.onChange=refresh;
  document.getElementById('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;curTopic[sec]=b.dataset.id;store.set(sec==='grammar'?'tg':'tv',b.dataset.id);const t=topicById(b.dataset.id);Quiz.start(sec,t,setFor(t));refresh()};
  document.getElementById('sets').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const t=topicById(curTopic[sec]);setSet(t,+b.dataset.s);Quiz.start(sec,t,+b.dataset.s);sets()};
  document.getElementById('weakBtn').onclick=()=>{Quiz.weak(sec);sets()};
  const t0=topicById(curTopic[sec])||S.topics[0];Quiz.start(sec,t0,setFor(t0));sets();
}

const LET=['a','b','c'];
const SET=20;
let setMap=store.get('sets',{});
function setSet(t,s){setMap[t.id]=s;store.set('sets',setMap)}
function setFor(t){if(setMap[t.id]!=null&&setMap[t.id]*SET<t.items.length)return setMap[t.id];
  const k=Math.ceil(t.items.length/SET);for(let s=0;s<k;s++){for(let i=s*SET;i<Math.min((s+1)*SET,t.items.length);i++)if(!P.mastered[t.id+':'+i])return s}return 0}
const fmt=s=>esc(s).replace(/_{3,}/g,'<span class="gap"></span>');
const Quiz={
  sec:null,topic:null,qs:[],i:0,score:0,missed:[],answered:false,weakMode:false,onChange:null,
  build(list){return list.map(q=>({...q,opts:shuffle([{t:q.c,ok:true},...q.w.map(w=>({t:w[0],why:w[1]}))])}))},
  set:0,
  start(sec,topic,s){this.sec=sec;this.topic=topic;this.weakMode=false;this.set=s||0;setSet(topic,this.set);
    const a=this.set*SET;this.qs=this.build(topic.items.slice(a,a+SET).map((it,j)=>({...it,tid:topic.id,n:a+j})));this.i=0;this.score=0;this.missed=[];this.draw()},
  weak(sec){const st=document.getElementById('stage');this.sec=sec;this.weakMode=true;this.topic=null;
    const pool=[];SECTIONS[sec].topics.forEach(t=>t.items.forEach((it,i)=>{if(!P.mastered[t.id+':'+i])pool.push({...it,tid:t.id,n:i})}));
    if(!pool.length){st.innerHTML=`<div class="empty"><b>Nothing left to practise.</b> You've answered every ${SECTIONS[sec].name.toLowerCase()} question correctly at least once.</div>`;return}
    this.qs=this.build(shuffle(pool).slice(0,20));this.i=0;this.score=0;this.missed=[];this.draw();if(this.onChange)this.onChange()},
  head(){return this.weakMode?'Weak questions · mixed topics':`${esc(this.topic.title)} · Set ${this.set+1}`},
  draw(){
    const st=document.getElementById('stage'); if(!st)return;
    if(this.i>=this.qs.length) return this.results();
    const q=this.qs[this.i],t=topicById(q.tid); this.answered=false;
    st.innerHTML=`<div class="q"><div class="q-kind"><span>${this.head()}</span><span class="mono">${this.i+1}/${this.qs.length} · ${this.score} ✓</span></div>
      <div class="label" style="text-transform:none;letter-spacing:0;font-size:14px">${esc(t.intro)}</div>
      ${t.box?`<div class="box"><span class="label">${t.id==='v2'?'Prefixes':'Words'}</span>${esc(t.box)}</div>`:''}
      <div class="sit">${fmt(q.p)}</div>
      <div class="opts stack">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${LET[k]})</span><span>${esc(o.t)}</span></button>`).join('')}</div>
      <div id="fb" aria-live="polite"></div>
      <button class="btn primary" id="next" hidden>Next question</button></div>`;
    st.querySelectorAll('.opt').forEach(b=>b.onclick=()=>this.answer(+b.dataset.k));
    document.getElementById('next').onclick=()=>{this.i++;this.draw();st.scrollIntoView({block:'start',behavior:'smooth'})};
  },
  answer(k){
    if(this.answered)return;this.answered=true;
    const st=document.getElementById('stage'),q=this.qs[this.i],o=q.opts[k],btns=st.querySelectorAll('.opt');
    btns.forEach((b,j)=>{b.disabled=true;if(q.opts[j].ok)b.classList.add('right')});
    const fb=document.getElementById('fb');
    if(o.ok){this.score++;P.mastered[q.tid+':'+q.n]=1;save();
      fb.innerHTML=`<div class="why good"><span class="h">Correct!</span><span class="rule"><b>${this.sec==='vocab'?'Remember':'Rule'}:</b> ${esc(q.tip)}</span></div>`}
    else{btns[k].classList.add('wrong');this.missed.push({q,pick:o});
      fb.innerHTML=`<div class="why"><span class="h">Not quite. “${esc(o.t)}” is wrong.</span><span>${esc(o.why)}</span><span>Correct: <b>${esc(q.c)}</b></span><span class="rule"><b>${this.sec==='vocab'?'Remember':'Rule'}:</b> ${esc(q.tip)}</span></div>`}
    const n=document.getElementById('next');n.hidden=false;n.textContent=this.i+1>=this.qs.length?'See results':'Next question';n.focus({preventScroll:true});
  },
  results(){
    const st=document.getElementById('stage'),total=this.qs.length,pct=Math.round(this.score/total*100);
    let nextBtn='';
    let goNext=null;
    if(!this.weakMode){const id=this.topic.id,k=id+':'+this.set;P.tries[id]=(P.tries[id]||0)+1;P.best[k]=Math.max(P.best[k]??0,this.score);save();
      const nSets=Math.ceil(this.topic.items.length/SET),list=SECTIONS[this.sec].topics,ix=list.indexOf(this.topic);
      if(this.set+1<nSets){nextBtn='<button class="btn" id="nextTopic">Next set</button>';goNext=()=>this.start(this.sec,this.topic,this.set+1)}
      else if(ix<list.length-1){nextBtn='<button class="btn" id="nextTopic">Next topic</button>';goNext=()=>{const nx=list[ix+1];curTopic[this.sec]=nx.id;store.set(this.sec==='grammar'?'tg':'tv',nx.id);this.start(this.sec,nx,setFor(nx))}}}
    if(this.onChange)this.onChange();
    const msg=pct>=90?'Excellent work.':pct>=70?'Good. Check the ones you missed below.':pct>=50?'Getting there. Read the explanations and try again.':'Read the rules below, then try this topic again.';
    st.innerHTML=`<div class="q"><div class="label">${this.head()} · Results</div>
      <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap"><span class="score mono">${this.score}/${total}</span><span style="font-size:18px">${pct}% · ${msg}</span></div>
      ${this.missed.length?`<div class="label">Your mistakes</div><div class="miss">${this.missed.map(m=>`<div style="grid-template-columns:1fr"><span style="color:var(--muted)">${fmt(m.q.p)}</span><span style="color:var(--bad);text-decoration:line-through">${esc(m.pick.t)}</span><b>${esc(m.q.c)}</b><span>${esc(m.pick.why)}</span></div>`).join('')}</div>`:''}
      <div class="row"><button class="btn primary" id="again">Try again</button>${this.missed.length?'<button class="btn" id="retry">Retry my mistakes</button>':''}${nextBtn}</div></div>`;
    document.getElementById('again').onclick=()=>this.weakMode?this.weak(this.sec):this.start(this.sec,this.topic,this.set);
    const r=document.getElementById('retry');if(r){const m=this.missed.map(x=>x.q);r.onclick=()=>{this.qs=this.build(shuffle(m));this.i=0;this.score=0;this.missed=[];this.draw()}}
    const nt=document.getElementById('nextTopic');if(nt)nt.onclick=()=>{goNext();if(this.onChange)this.onChange()};
    st.scrollIntoView({block:'start',behavior:'smooth'});
  }
};

/* ---------- SPEAKING ---------- */
const Speaking={
  timer:null,
  stop(){if(this.timer){clearInterval(this.timer);this.timer=null}},
  list(){this.stop();
    view.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">
      <div class="q" style="gap:8px"><div class="label">Speaking cards</div><div style="font-size:16px">Each card has Part 1 (short answers, about 30 seconds) and Part 2 (longer answers, about 1 minute). Learn the topic words first, then start the timed practice.</div>
      <div class="note">Tip: open your phone's voice recorder while you practise, then listen back and check your grammar and the topic words you used.</div></div>
      <div class="cards">${D.speaking.map(c=>`<button class="scard${P.spoken[c.id]?' done':''}" data-card="${c.id}"><span class="L">Card ${c.id}</span><span class="tp">${esc(c.topic)}</span>${P.spoken[c.id]?'<span class="pill ok" style="align-self:flex-start">Practised</span>':''}</button>`).join('')}</div>
      <button class="btn" id="rand">Give me a random card</button></div>`;
    view.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>this.open(b.dataset.card));
    document.getElementById('rand').onclick=()=>this.open(D.speaking[Math.random()*D.speaking.length|0].id);
  },
  open(id){this.stop();const c=D.speaking.find(x=>x.id===id);
    view.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">
      <button class="linkbtn" id="back" style="align-self:flex-start">← All cards</button>
      <div class="q"><div class="q-kind"><span>Card ${c.id}</span>${P.spoken[c.id]?'<span class="pill ok">Practised</span>':''}</div>
        <h2 style="font-family:var(--f-display);font-weight:800;font-size:28px;margin:0;letter-spacing:-.01em">${esc(c.topic)}</h2>
        <div class="label">Topic vocabulary: try to use 3 or more</div>
        <div class="vlist">${c.vocab.map(v=>`<div class="vitem"><b>${esc(v[0])}</b><span>${esc(v[1])}</span></div>`).join('')}</div>
        <div class="label">Part 1</div><ol class="qlist">${c.p1.map(q=>`<li>${esc(q)}</li>`).join('')}</ol>
        <div class="label">Part 2</div><ol class="qlist">${c.p2.map(q=>`<li>${esc(q)}</li>`).join('')}</ol>
        <button class="btn primary" id="go">Start timed practice</button></div></div>`;
    document.getElementById('back').onclick=()=>this.list();
    document.getElementById('go').onclick=()=>this.practice(c,0);
  },
  practice(c,i){this.stop();
    const qs=[...c.p1.map(q=>({q,part:1,sec:30})),...c.p2.map(q=>({q,part:2,sec:60}))];
    if(i>=qs.length){P.spoken[c.id]=1;save();
      view.innerHTML=`<div class="q"><div class="label">Card ${c.id} · ${esc(c.topic)}</div><span class="score">Done!</span>
        <div style="font-size:17px">You answered all 8 questions. This card is now marked as practised.</div>
        <div class="row"><button class="btn primary" id="again">Practise again</button><button class="btn" id="all">All cards</button></div></div>`;
      document.getElementById('again').onclick=()=>this.practice(c,0);document.getElementById('all').onclick=()=>this.list();return}
    const q=qs[i];let left=q.sec,running=false;
    view.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px"><button class="linkbtn" id="back" style="align-self:flex-start">← Card ${c.id}</button>
      <div class="q"><div class="q-kind"><span>Card ${c.id} · Part ${q.part}</span><span class="mono">${i+1}/8</span></div>
      <div class="sit" style="font-size:22px;font-weight:600">${esc(q.q)}</div>
      <div class="timer"><div class="ring" id="ring"><span id="sec">${q.sec}</span></div>
        <div style="display:flex;flex-direction:column;gap:4px"><span class="note">${q.part===1?'Part 1: give a short answer with a reason (about 30 seconds).':'Part 2: give a longer answer with reasons and examples (about 1 minute).'}</span>
        <span class="note">Words to try: ${c.vocab.slice(0,5).map(v=>esc(v[0])).join(' · ')}</span></div></div>
      <div class="row"><button class="btn primary" id="tbtn">Start timer</button><button class="btn" id="nbtn">${i+1<8?'Next question':'Finish card'}</button></div></div></div>`;
    const ring=document.getElementById('ring'),sec=document.getElementById('sec'),tb=document.getElementById('tbtn');
    const paint=()=>{sec.textContent=left>=0?left:'+'+(-left);ring.style.setProperty('--p',Math.max(left,0)/q.sec);ring.classList.toggle('over',left<0)};
    tb.onclick=()=>{if(running){this.stop();running=false;tb.textContent='Resume'}else{running=true;tb.textContent='Pause';this.timer=setInterval(()=>{left--;paint()},1000)}};
    document.getElementById('nbtn').onclick=()=>this.practice(c,i+1);
    document.getElementById('back').onclick=()=>this.open(c.id);
  }
};

document.addEventListener('keydown',e=>{
  if(/^[1-3]$/.test(e.key)&&document.querySelector('#stage .opt:not([disabled])')){const n=+e.key-1;if(n<Quiz.qs[Quiz.i]?.opts.length)Quiz.answer(n)}
});
if(!['progress','grammar','vocab','speaking'].includes(tab))tab='progress';
setTab(tab);
</script>
