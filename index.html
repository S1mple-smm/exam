<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: one study column; sticky lesson picker + mode tabs; one card on stage at a time */
:root{
  --bg:#eef2f1; --surface:#ffffff; --ink:#15302e; --muted:#5b706d; --line:#d3dedb;
  --slate:#1f4d49; --slate-ink:#ffffff; --mark:#f3d23c; --mark-ink:#2a2300;
  --good:#1f7a4d; --good-bg:#dff3e7; --bad:#b0372b; --bad-bg:#fbe3df;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Source Serif 4",Georgia,serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --shadow:0 1px 0 rgba(21,48,46,.06),0 10px 30px -12px rgba(21,48,46,.25);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1b1a; --surface:#172725; --ink:#e3eeec; --muted:#93aaa6; --line:#2a3f3c;
  --slate:#8fd0c6; --slate-ink:#0f1b1a; --mark:#f3d23c; --mark-ink:#2a2300;
  --good:#6fd3a0; --good-bg:#173528; --bad:#f19a8e; --bad-bg:#3a1f1b;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1b1a; --surface:#172725; --ink:#e3eeec; --muted:#93aaa6; --line:#2a3f3c;
  --slate:#8fd0c6; --slate-ink:#0f1b1a; --mark:#f3d23c; --mark-ink:#2a2300;
  --good:#6fd3a0; --good-bg:#173528; --bad:#f19a8e; --bad-bg:#3a1f1b;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1.02;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1 em{font-style:normal;background:linear-gradient(transparent 58%,var(--mark) 58% 92%,transparent 92%);color:inherit;padding:0 .08em}
.sub{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--mark);outline-offset:2px}

/* picker */
.picker{display:flex;flex-direction:column;gap:8px}
.picker-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.label{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-display);font-weight:500;font-size:14px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;display:inline-flex;gap:6px;align-items:baseline}
.chip small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--slate);color:var(--slate-ink);border-color:var(--slate)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.75}
.linkbtn{background:none;border:0;padding:2px 4px;font-family:var(--f-display);font-weight:500;font-size:13px;color:var(--slate);text-decoration:underline;text-underline-offset:3px}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:4px;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tab{border:0;background:none;border-radius:10px;padding:9px 6px;font-family:var(--f-display);font-weight:700;font-size:15px}
.tab[aria-selected="true"]{background:var(--mark);color:var(--mark-ink)}

/* stats bar */
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:13px;color:var(--muted)}
.meter{flex:1 1 160px;height:8px;background:var(--line);border-radius:99px;overflow:hidden;min-width:120px}
.meter i{display:block;height:100%;background:var(--good);width:0;transition:width .4s}

/* flashcard */
.stage{perspective:1400px}
.card{position:relative;width:100%;min-height:300px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1);cursor:pointer;border:0;background:none;padding:0;text-align:left;display:grid}
.card.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);border:1.5px solid var(--line);padding:22px 22px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.face.back{transform:rotateY(180deg)}
.face-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.word{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,8vw,48px);line-height:1.05;letter-spacing:-.015em;margin:auto 0;text-wrap:balance;overflow-wrap:anywhere}
.ru-big{font-family:var(--f-body);font-weight:600;font-size:clamp(24px,6vw,34px);line-height:1.2;margin:auto 0;overflow-wrap:anywhere}
.hint{font-family:var(--f-display);font-size:13px;color:var(--muted)}
.back .w-small{font-family:var(--f-display);font-weight:700;font-size:20px}
.back .ru{font-weight:600;font-size:19px;color:var(--slate)}
.back .def{font-size:17px}
.back .ex{font-style:italic;color:var(--muted);border-left:3px solid var(--mark);padding-left:12px}
.back .ex b{font-style:normal;color:var(--ink);font-weight:600}
.speak{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;flex:none}
.speak svg{width:16px;height:16px;fill:currentColor}

.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-family:var(--f-display);font-weight:700;font-size:16px}
.btn.learn{border-color:var(--bad);color:var(--bad)}
.btn.know{background:var(--good);border-color:var(--good);color:var(--surface)}
.btn.primary{background:var(--slate);border-color:var(--slate);color:var(--slate-ink)}
.btn:disabled{opacity:.45;cursor:default}
.tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;font-size:14px}
.tools .grp{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.small-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-family:var(--f-display);font-weight:500;font-size:13px}
.small-btn[aria-pressed="true"]{border-color:var(--slate);color:var(--slate);font-weight:700}

/* quiz */
.q{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.q-kind{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.prompt{font-size:20px;line-height:1.4;overflow-wrap:anywhere}
.prompt.ru{font-weight:600;font-size:24px}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);margin:0 .15em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;text-align:left;font-family:var(--f-display);font-weight:500;font-size:16px;line-height:1.25;display:flex;gap:10px;align-items:baseline;min-width:0;overflow-wrap:anywhere}
.opt .k{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:none}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.feedback{font-size:15px;min-height:1.5em}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}
.typebox{display:flex;gap:8px;flex-wrap:wrap}
.typebox input{flex:1 1 220px;min-width:0;font-family:var(--f-display);font-size:18px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.typebox input.right{border-color:var(--good);background:var(--good-bg)}
.typebox input.wrong{border-color:var(--bad);background:var(--bad-bg)}
.setup{display:flex;flex-direction:column;gap:14px}
.setup .opts-line{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* results */
.score{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:1;letter-spacing:-.03em}
.miss{display:flex;flex-direction:column;gap:0;border-top:1.5px solid var(--line)}
.miss div{padding:10px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px;font-size:15px}
.miss b{font-family:var(--f-display)}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border-radius:20px;border:1.5px dashed var(--line)}
footer{font-size:13px;color:var(--muted)}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}
@media (prefers-reduced-motion:reduce){.card{transition:none}.meter i{transition:none}}
@media (hover:none){.desk{display:none}}
</style>
<style>
.why{border-left:3px solid var(--bad);background:var(--bad-bg);padding:10px 14px;border-radius:0 10px 10px 0;font-size:16px;display:flex;flex-direction:column;gap:6px}
.why.good{border-left-color:var(--good);background:var(--good-bg)}
.why .h{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--bad)}
.why.good .h{color:var(--good)}
.rule{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.rule b{font-family:var(--f-display);color:var(--ink);font-weight:700}
.sit{font-size:19px;line-height:1.45;overflow-wrap:anywhere}
.gap{display:inline-block;min-width:4em;border-bottom:2px solid var(--ink);margin:0 .1em;height:1em;vertical-align:baseline}
.opts.stack{grid-template-columns:1fr}
.box{border:1.5px dashed var(--line);border-radius:12px;padding:10px 14px;font-family:var(--f-display);font-size:14px;line-height:1.6;color:var(--ink);background:var(--bg)}
.box .label{display:block;margin-bottom:2px}
.tabs4{grid-template-columns:repeat(4,1fr)}
@media (max-width:420px){.tab{font-size:13px;padding:9px 2px}}
.prog-hero{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.prog-hero{grid-template-columns:1fr}}
.tile{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile .big{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;letter-spacing:-.02em}
.tile .big small{font-size:16px;color:var(--muted);font-weight:500}
.rows{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
@media (max-width:560px){.prow{grid-template-columns:minmax(0,1fr) auto}.prow .meter{grid-column:1/-1;grid-row:2}}
.prow .t{font-family:var(--f-display);font-weight:500;font-size:15px;min-width:0}
.prow .t small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pill{font-family:var(--f-mono);font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.pill.warn{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.pill.go{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.prow button{border:0;background:none;cursor:pointer;padding:0;text-align:left}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.scard{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:104px}
.scard .L{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1}
.scard .tp{font-family:var(--f-display);font-weight:500;font-size:14px}
.scard.done{border-color:var(--good)}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.vitem{background:var(--bg);border-radius:10px;padding:8px 12px;min-width:0}
.vitem b{font-family:var(--f-display);font-weight:700;display:block}
.vitem span{font-size:14px;color:var(--muted)}
.qlist{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;font-size:17px}
.timer{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ring{--p:1;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--slate) calc(var(--p)*360deg),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:66px;height:66px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.ring.over{background:conic-gradient(var(--bad) 360deg,var(--line) 0)}
.note{font-size:14px;color:var(--muted)}
</style>

<script>
const D = {"grammar": [{"id": "g1", "title": "Direct and indirect questions", "intro": "Read each situation and choose the correct question.", "items": [{"p": "You want to ask a hotel receptionist what time the pool closes.", "c": "Could you tell me what time the pool closes?", "w": [["Could you tell me what time does the pool close?", "Indirect questions don't use do/does. Say \"the pool closes\"."], ["Could you tell me what time closes the pool?", "In an indirect question the subject (the pool) comes before the verb."]], "tip": "Indirect: Could you tell me + question word + subject + verb."}, {"p": "You want to know where your friend bought his trainers.", "c": "Where did you buy your trainers?", "w": [["Where you bought your trainers?", "A direct past question needs the helper \"did\"."], ["Where did you bought your trainers?", "After \"did\", use the base verb \"buy\"."]], "tip": "Direct: question word + did + subject + base verb."}, {"p": "You want to ask a stranger if the bank is open on Sundays.", "c": "Do you know if the bank is open on Sundays?", "w": [["Do you know is the bank open on Sundays?", "A yes/no indirect question needs \"if\" or \"whether\"."], ["Do you know if is the bank open on Sundays?", "After \"if\", use normal order: the bank is."]], "tip": "Do you know + if + subject + verb?"}, {"p": "You want to know how long your classmate has been learning English.", "c": "How long have you been learning English?", "w": [["How long you have been learning English?", "In a direct question \"have\" comes before \"you\"."], ["How long are you learning English?", "For an action from the past until now, use \"have been + -ing\"."]], "tip": "How long + have + subject + been + -ing?"}, {"p": "You want to ask your teacher what the homework is.", "c": "Can you tell me what the homework is?", "w": [["Can you tell me what is the homework?", "In an indirect question the verb comes after the subject: the homework is."], ["Can you tell me what the homework?", "The verb \"is\" is missing."]], "tip": "...what + subject + is."}, {"p": "You want to ask a waiter whether the soup is spicy.", "c": "I'd like to know whether the soup is spicy.", "w": [["I'd like to know is the soup spicy.", "A yes/no indirect question needs \"whether\" or \"if\"."], ["I'd like to know whether is the soup spicy.", "After \"whether\", use normal order: the soup is."]], "tip": "I'd like to know + whether/if + subject + verb."}, {"p": "You want to know who wrote the book your friend is reading.", "c": "Who wrote this book?", "w": [["Who did write this book?", "\"Who\" is the subject (someone wrote it), so no \"did\" is needed."], ["Who did wrote this book?", "Subject questions don't use \"did\", and never use \"did\" + past form."]], "tip": "When \"who\" is the subject, use normal order with no did."}, {"p": "You want to know when your new neighbour moved here.", "c": "When did you move here?", "w": [["When you moved here?", "A direct past question needs the helper \"did\"."], ["When did you moved here?", "After \"did\", use the base verb \"move\"."]], "tip": "When + did + subject + base verb?"}, {"p": "You want to ask a tourist office worker how to get to the old city.", "c": "Could you tell me how I can get to the old city?", "w": [["Could you tell me how can I get to the old city?", "In an indirect question \"can\" goes after the subject: how I can get."], ["Could you tell me how I can get the old city?", "We \"get to\" a place, so you need \"to\"."]], "tip": "...how + subject + can + base verb."}, {"p": "You want to know if your friend has ever tried sushi.", "c": "Have you ever tried sushi?", "w": [["Did you ever tried sushi?", "For life experience, use \"Have you ever + V3\". \"Did\" can't be followed by a past form."], ["Have you ever try sushi?", "After \"have\", use the past participle \"tried\"."]], "tip": "Have you ever + past participle?"}, {"p": "You want to know what the manager wants from you.", "c": "Do you know what the manager wants?", "w": [["Do you know what does the manager want?", "Indirect questions don't use does."], ["Do you know what the manager want?", "\"The manager\" = he/she, so the verb is \"wants\"."]], "tip": "Do you know + what + subject + verb (with -s)?"}, {"p": "You want to know which bus your friend takes to work.", "c": "Which bus do you take to work?", "w": [["Which bus you take to work?", "The helper \"do\" is missing."], ["Which bus do you takes to work?", "After \"do\", use the base verb \"take\"."]], "tip": "Which + noun + do + subject + base verb?"}, {"p": "You want to know where your new classmate lives.", "c": "Where do you live?", "w": [["Where you live?", "A present simple question needs the helper \"do\" before the subject."], ["Where live you?", "English never puts the main verb before the subject. Use do + subject + verb."]], "tip": "Question word + do/does + subject + base verb."}, {"p": "You want to know what your friend's brother does for work.", "c": "What does your brother do?", "w": [["What does your brother does?", "After \"does\", the main verb goes back to its base form: \"do\", not \"does\"."], ["What do your brother do?", "\"Your brother\" = he, so the helper is \"does\", not \"do\"."]], "tip": "he / she / it → does + base verb."}, {"p": "You want to ask a shop assistant what time the shop opens.", "c": "What time does the shop open?", "w": [["What time the shop opens?", "This is a direct question, so it needs the helper \"does\"."], ["What time does open the shop?", "The subject (the shop) must come before the verb: does + the shop + open."]], "tip": "Question word + does + subject + base verb."}, {"p": "You want to know how often your friend goes to the gym.", "c": "How often do you go to the gym?", "w": [["How often you go to the gym?", "The helper \"do\" is missing."], ["How often do you goes to the gym?", "After \"do\", use the base verb \"go\". \"You\" never takes -s."]], "tip": "How often + do/does + subject + base verb."}, {"p": "You want to know if your new colleague speaks Russian.", "c": "Do you speak Russian?", "w": [["Are you speak Russian?", "\"Speak\" is a normal verb, so the helper is \"do\", not \"are\"."], ["You speak Russian do?", "In a yes/no question the helper \"do\" comes first."]], "tip": "Yes/no question: Do/Does + subject + base verb."}, {"p": "You want to ask your classmate what this word means.", "c": "What does this word mean?", "w": [["What means this word?", "\"This word\" is the subject, so you need does + this word + mean."], ["What does this word means?", "After \"does\", use the base form \"mean\", not \"means\"."]], "tip": "What + does + subject + base verb."}, {"p": "You want to know which bus goes to the city centre.", "c": "Which bus goes to the city centre?", "w": [["Which bus does go to the city centre?", "\"Which bus\" is the subject of the question, so you don't need \"does\"."], ["Which bus do go to the city centre?", "Subject questions don't use do. \"Bus\" is singular, so the verb is \"goes\"."]], "tip": "When the question word is the subject, use normal order with no do/does."}, {"p": "You want to ask your teacher how to spell \"necessary\".", "c": "How do you spell \"necessary\"?", "w": [["How you spell \"necessary\"?", "The helper \"do\" is missing."], ["How spell you \"necessary\"?", "Don't swap the main verb and subject. Use do + you + spell."]], "tip": "How + do + subject + base verb."}, {"p": "You want to know where your friend's parents work.", "c": "Where do your parents work?", "w": [["Where does your parents work?", "\"Parents\" is plural (they), so use \"do\", not \"does\"."], ["Where your parents work?", "The helper \"do\" is missing."]], "tip": "I / you / we / they → do."}, {"p": "You meet a tourist and want to know her home country.", "c": "Where do you come from?", "w": [["Where are you come from?", "Don't mix \"are\" with a normal verb. Say \"Where are you from?\" or \"Where do you come from?\"."], ["Where you come from?", "The helper \"do\" is missing."]], "tip": "Where are you from? / Where do you come from? Never mix them."}, {"p": "You want to know what your friend did last weekend.", "c": "What did you do last weekend?", "w": [["What did you did last weekend?", "\"Did\" already shows the past, so the main verb stays in base form: \"do\"."], ["What you did last weekend?", "The helper \"did\" is missing."]], "tip": "Question word + did + subject + base verb."}, {"p": "You want to know when your classmate arrived in Tashkent.", "c": "When did you arrive in Tashkent?", "w": [["When did you arrived in Tashkent?", "After \"did\", use the base verb \"arrive\", not \"arrived\"."], ["When you arrived in Tashkent?", "The helper \"did\" is missing."]], "tip": "did + subject + base verb (no -ed)."}, {"p": "You want to know if your friend watched the match yesterday.", "c": "Did you watch the match yesterday?", "w": [["Did you watched the match yesterday?", "After \"did\", use the base verb \"watch\"."], ["Were you watch the match yesterday?", "\"Watch\" is a normal verb, so use \"did\", not \"were\"."]], "tip": "Yes/no past question: Did + subject + base verb."}, {"p": "You want to know where your colleague bought her bag.", "c": "Where did you buy your bag?", "w": [["Where did you bought your bag?", "After \"did\", use \"buy\", not \"bought\"."], ["Where bought you your bag?", "Use did + subject + base verb. Don't swap the verb and subject."]], "tip": "Where + did + subject + base verb."}, {"p": "You want to know why your friend was late this morning.", "c": "Why were you late this morning?", "w": [["Why did you be late this morning?", "\"Be\" doesn't use \"did\". Put \"were\" before the subject."], ["Why you were late this morning?", "In a direct question \"were\" comes before \"you\"."]], "tip": "With be: Why + was/were + subject?"}, {"p": "You want to know how long the film lasted.", "c": "How long did the film last?", "w": [["How long the film lasted?", "The helper \"did\" is missing."], ["How long did last the film?", "The subject (the film) must come before the verb."]], "tip": "How long + did + subject + base verb."}, {"p": "You want to know who your sister met at the party.", "c": "Who did you meet at the party?", "w": [["Who you met at the party?", "\"Who\" is the object here (you met someone), so you need \"did\"."], ["Who did you met at the party?", "After \"did\", use the base verb \"meet\"."]], "tip": "Object question: Who + did + subject + base verb."}, {"p": "You want to know what time your friend got up today.", "c": "What time did you get up today?", "w": [["What time did you got up today?", "After \"did\", use \"get\", not \"got\"."], ["What time you got up today?", "The helper \"did\" is missing."]], "tip": "What time + did + subject + base verb."}, {"p": "You want to know if your teacher enjoyed her holiday.", "c": "Did you enjoy your holiday?", "w": [["Did you enjoyed your holiday?", "After \"did\", use the base verb \"enjoy\"."], ["Enjoyed you your holiday?", "English doesn't move the main verb to the front. Use \"Did you enjoy...\"."]], "tip": "Did + subject + base verb?"}, {"p": "You want to know where your new friend was born.", "c": "Where were you born?", "w": [["Where did you born?", "\"Born\" is used with \"be\": were you born, not did you born."], ["Where you were born?", "In a direct question \"were\" comes before \"you\"."]], "tip": "Where + was/were + subject + born?"}, {"p": "You want to know what your friend is reading right now.", "c": "What are you reading?", "w": [["What you are reading?", "In a direct question \"are\" comes before \"you\"."], ["What do you reading?", "The continuous uses be (are) + -ing, not do."]], "tip": "Question word + am/is/are + subject + -ing."}, {"p": "You want to know why your brother is laughing.", "c": "Why are you laughing?", "w": [["Why you laughing?", "The verb \"are\" is missing."], ["Why do you laughing?", "Use \"are\" with -ing, not \"do\"."]], "tip": "Why + are + subject + -ing?"}, {"p": "You want to ask where the meeting room is.", "c": "Where is the meeting room?", "w": [["Where the meeting room is?", "In a direct question \"is\" comes before the subject. This order is only for indirect questions."], ["Where does the meeting room is?", "Don't use \"does\" together with \"is\"."]], "tip": "Where + is/are + subject?"}, {"p": "You want to know how old a new student is.", "c": "How old are you?", "w": [["How old you are?", "In a direct question \"are\" comes before \"you\"."], ["How many years do you have?", "English uses \"be\" for age, not \"have\"."]], "tip": "Age: How old + am/is/are + subject?"}, {"p": "You want to know who your friend is waiting for.", "c": "Who are you waiting for?", "w": [["Who you are waiting for?", "In a direct question \"are\" comes before \"you\"."], ["Who are you waiting?", "\"Wait\" needs \"for\": you wait for someone."]], "tip": "Keep the preposition at the end: Who are you waiting for?"}, {"p": "You want to know if your classmate is tired.", "c": "Are you tired?", "w": [["Do you tired?", "\"Tired\" is an adjective, so use \"be\", not \"do\"."], ["Is you tired?", "\"You\" always takes \"are\", never \"is\"."]], "tip": "Adjectives use be: Are you tired?"}, {"p": "You want to know about the weather in Samarkand.", "c": "What is the weather like in Samarkand?", "w": [["How is the weather like in Samarkand?", "Say \"What is ... like?\" or \"How is the weather?\" but don't mix \"how\" with \"like\"."], ["What the weather is like in Samarkand?", "In a direct question \"is\" comes before the subject."]], "tip": "What + is + subject + like?"}, {"p": "You want to know what your colleague is working on this week.", "c": "What are you working on this week?", "w": [["What are you work on this week?", "The continuous needs the -ing form: \"working\"."], ["What do you working on this week?", "Use be (are) with -ing, not \"do\"."]], "tip": "be + subject + verb-ing."}, {"p": "You want to know where your friend's keys are.", "c": "Where are your keys?", "w": [["Where is your keys?", "\"Keys\" is plural, so use \"are\"."], ["Where your keys are?", "In a direct question \"are\" comes before the subject."]], "tip": "Plural subject → are."}, {"p": "You want to ask the price of some shoes.", "c": "How much are these shoes?", "w": [["How much is these shoes?", "\"These shoes\" is plural, so use \"are\"."], ["How much these shoes are?", "In a direct question \"are\" comes before the subject."]], "tip": "How much + is/are + subject?"}, {"p": "You want to know what your friend is going to study at university.", "c": "What are you going to study at university?", "w": [["What you are going to study at university?", "In a direct question \"are\" comes before \"you\"."], ["What are you going study at university?", "\"Going to\" always needs \"to\"."]], "tip": "Question word + am/is/are + subject + going to + base verb."}, {"p": "You want to know when your colleague will finish the report.", "c": "When will you finish the report?", "w": [["When you will finish the report?", "In a direct question \"will\" comes before \"you\"."], ["When will you to finish the report?", "After \"will\", use the base verb without \"to\"."]], "tip": "Question word + will + subject + base verb."}, {"p": "You want your friend's opinion about rain tomorrow.", "c": "Do you think it will rain tomorrow?", "w": [["Do you think will it rain tomorrow?", "After \"Do you think\", use normal order: it will rain."], ["Are you think it will rain tomorrow?", "\"Think\" is a normal verb, so the helper is \"do\"."]], "tip": "Do you think + subject + verb?"}, {"p": "You want to know what time the concert starts tonight.", "c": "What time does the concert start tonight?", "w": [["What time does the concert starts tonight?", "After \"does\", use the base verb \"start\"."], ["What time the concert starts tonight?", "The helper \"does\" is missing."]], "tip": "Timetables use present simple: does + subject + base verb."}, {"p": "You want to know if your friend is coming to the party on Saturday.", "c": "Are you coming to the party on Saturday?", "w": [["Do you coming to the party on Saturday?", "Plans with -ing use \"are\", not \"do\"."], ["Are you come to the party on Saturday?", "After \"are\", you need the -ing form: \"coming\"."]], "tip": "Are + subject + verb-ing (for plans)?"}, {"p": "You want to know where your classmate will stay in London.", "c": "Where will you stay in London?", "w": [["Where will you staying in London?", "After \"will\", use the base verb \"stay\"."], ["Where you will stay in London?", "In a direct question \"will\" comes before \"you\"."]], "tip": "Where + will + subject + base verb?"}, {"p": "You want to know how long the training will take.", "c": "How long will the training take?", "w": [["How long will take the training?", "The subject (the training) must come before the main verb."], ["How long the training will take?", "In a direct question \"will\" comes before the subject."]], "tip": "How long + will + subject + base verb?"}, {"p": "You want to know who your friend is going to invite to her birthday.", "c": "Who are you going to invite to your birthday?", "w": [["Who you are going to invite to your birthday?", "In a direct question \"are\" comes before \"you\"."], ["Who are you going to invited to your birthday?", "After \"to\", use the base verb \"invite\"."]], "tip": "going to + base verb."}, {"p": "You want to know what your friend will do after graduation.", "c": "What will you do after graduation?", "w": [["What will you doing after graduation?", "After \"will\", use the base verb \"do\"."], ["What you will do after graduation?", "In a direct question \"will\" comes before \"you\"."]], "tip": "What + will + subject + base verb?"}, {"p": "You want to know when your brother's flight leaves.", "c": "When does your flight leave?", "w": [["When leaves your flight?", "Use does + subject + base verb. Don't put the verb first."], ["When does your flight leaves?", "After \"does\", use the base verb \"leave\"."]], "tip": "When + does + subject + base verb?"}, {"p": "You need a stranger's help with your heavy bag.", "c": "Could you help me with my bag?", "w": [["Could you helping me with my bag?", "After \"could\", use the base verb \"help\"."], ["Could you to help me with my bag?", "Don't put \"to\" after \"could\"."]], "tip": "Could + subject + base verb?"}, {"p": "You want to ask the waiter for the bill.", "c": "Could I have the bill, please?", "w": [["Could I to have the bill, please?", "Don't put \"to\" after \"could\"."], ["I could have the bill, please?", "In a question \"could\" comes before \"I\"."]], "tip": "Could I + base verb, please?"}, {"p": "You want to offer your guest a drink.", "c": "Would you like something to drink?", "w": [["Do you would like something to drink?", "Don't use \"do\" with \"would\"."], ["Would you like drinking something?", "After \"would like\", use \"to + verb\": something to drink / to drink something."]], "tip": "Would you like + noun / to + verb?"}, {"p": "You want to ask your teacher if you can leave early today.", "c": "Can I leave early today?", "w": [["Can I to leave early today?", "Don't put \"to\" after \"can\"."], ["Do I can leave early today?", "Never use \"do\" with \"can\"."]], "tip": "Can + subject + base verb?"}, {"p": "You want to know if your friend can swim.", "c": "Can you swim?", "w": [["Do you can swim?", "Never use \"do\" with \"can\"."], ["Can you swimming?", "After \"can\", use the base verb \"swim\"."]], "tip": "Can + subject + base verb?"}, {"p": "You want a colleague to close the window, politely.", "c": "Would you mind closing the window?", "w": [["Would you mind to close the window?", "After \"mind\", use the -ing form: \"closing\"."], ["Would you mind close the window?", "After \"mind\", use the -ing form: \"closing\"."]], "tip": "Would you mind + verb-ing?"}, {"p": "You want to ask a receptionist if you can use the phone.", "c": "May I use your phone?", "w": [["May I using your phone?", "After \"may\", use the base verb \"use\"."], ["Am I may use your phone?", "Don't use \"am\" with \"may\". \"May\" comes first."]], "tip": "May I + base verb?"}, {"p": "You want your friend's advice about clothes for an interview.", "c": "What should I wear to the interview?", "w": [["What I should wear to the interview?", "In a direct question \"should\" comes before \"I\"."], ["What should I to wear to the interview?", "Don't put \"to\" after \"should\"."]], "tip": "Question word + should + subject + base verb?"}, {"p": "You want to try on a jacket in a shop.", "c": "Can I try on this jacket?", "w": [["Can I to try on this jacket?", "Don't put \"to\" after \"can\"."], ["Can try I on this jacket?", "The subject \"I\" must come before the main verb."]], "tip": "Can I + base verb?"}, {"p": "You want someone's name, politely.", "c": "Could you tell me your name, please?", "w": [["Could you say me your name, please?", "We \"tell\" someone something. \"Say me\" is wrong."], ["Could you to tell me your name, please?", "Don't put \"to\" after \"could\"."]], "tip": "tell + person + thing (tell me your name)."}, {"p": "You are lost and want to find the bus stop.", "c": "Could you tell me where the bus stop is?", "w": [["Could you tell me where is the bus stop?", "In an indirect question the verb comes after the subject: where the bus stop is."], ["Could you tell me where the bus stop?", "The verb \"is\" is missing."]], "tip": "Could you tell me + question word + subject + verb."}, {"p": "You want to know when breakfast starts at the hotel.", "c": "Can you tell me what time breakfast starts?", "w": [["Can you tell me what time does breakfast start?", "Indirect questions don't use do/does. Say \"breakfast starts\"."], ["Can you tell me what time breakfast start?", "\"Breakfast\" = it, so the verb is \"starts\"."]], "tip": "No do/does in indirect questions. Keep the -s."}, {"p": "You want to know the age of a castle on a tour.", "c": "Could you tell me how old the castle is?", "w": [["Could you tell me how old is the castle?", "In an indirect question the verb goes after the subject: the castle is."], ["Could you tell me how old the castle has?", "For age, English uses \"be\", not \"have\"."]], "tip": "...how old + subject + is."}, {"p": "You want to know when the library closes.", "c": "Can you tell me when the library closes?", "w": [["Can you tell me when does the library close?", "Indirect questions don't use do/does."], ["Can you tell me when closes the library?", "The subject (the library) must come before the verb."]], "tip": "...when + subject + verb."}, {"p": "You want directions to the museum.", "c": "Could you tell me how to get to the museum?", "w": [["Could you tell me how to get the museum?", "We \"get to\" a place, so you need \"to\"."], ["Could you tell me how do I get to the museum?", "Indirect questions don't use do. Say \"how to get\" or \"how I can get\"."]], "tip": "Could you tell me how to + verb?"}, {"p": "You want your teacher to explain a sentence.", "c": "Could you tell me what this sentence means?", "w": [["Could you tell me what does this sentence mean?", "Indirect questions don't use does. Say \"this sentence means\"."], ["Could you tell me what this sentence mean?", "\"This sentence\" = it, so the verb is \"means\"."]], "tip": "...what + subject + verb (with -s)."}, {"p": "You want to know where you can park at a hotel.", "c": "Can you tell me where I can park my car?", "w": [["Can you tell me where can I park my car?", "In an indirect question \"can\" goes after the subject: where I can park."], ["Can you tell me where I can to park my car?", "Don't put \"to\" after \"can\"."]], "tip": "...where + subject + can + base verb."}, {"p": "You want to know why the lesson was cancelled.", "c": "Can you tell me why the lesson was cancelled?", "w": [["Can you tell me why was the lesson cancelled?", "In an indirect question \"was\" goes after the subject: the lesson was cancelled."], ["Can you tell me why did the lesson cancelled?", "The passive uses \"was\", and indirect questions never use \"did\"."]], "tip": "...why + subject + was + past participle."}, {"p": "You want to know which platform your train leaves from.", "c": "Could you tell me which platform the train leaves from?", "w": [["Could you tell me which platform does the train leave from?", "Indirect questions don't use does."], ["Could you tell me which platform the train leaves?", "A train leaves FROM a platform, so you need \"from\"."]], "tip": "Keep the preposition: ...which platform the train leaves from."}, {"p": "You want to know the price of a phone.", "c": "Could you tell me how much this phone costs?", "w": [["Could you tell me how much does this phone cost?", "Indirect questions don't use does."], ["Could you tell me how much costs this phone?", "The subject (this phone) must come before the verb."]], "tip": "...how much + subject + verb."}, {"p": "You want to know where Anna lives.", "c": "Do you know where Anna lives?", "w": [["Do you know where does Anna live?", "Indirect questions don't use does. Say \"Anna lives\"."], ["Do you know where lives Anna?", "The subject (Anna) must come before the verb."]], "tip": "Do you know + question word + subject + verb?"}, {"p": "You want to know what time the exam starts.", "c": "Do you know what time the exam starts?", "w": [["Do you know what time does the exam start?", "Indirect questions don't use does."], ["Do you know what time starts the exam?", "The subject (the exam) must come before the verb."]], "tip": "...what time + subject + verb."}, {"p": "You want to know who the new manager is.", "c": "Do you know who the new manager is?", "w": [["Do you know who is the new manager?", "In an indirect question the verb comes after the subject: the new manager is."], ["Do you know who the new manager?", "The verb \"is\" is missing."]], "tip": "...who + subject + is."}, {"p": "You want to know the price of the tickets.", "c": "Do you know how much the tickets cost?", "w": [["Do you know how much do the tickets cost?", "Indirect questions don't use do."], ["Do you know how much the tickets costs?", "\"Tickets\" is plural, so the verb is \"cost\" with no -s."]], "tip": "Plural subject → no -s."}, {"p": "You are thinking about why the shop is closed today.", "c": "I wonder why the shop is closed today.", "w": [["I wonder why is the shop closed today.", "After \"I wonder\", use normal order: the shop is closed."], ["I wonder why does the shop closed today.", "Don't use \"does\". \"Closed\" here is an adjective, so use \"is\"."]], "tip": "I wonder + question word + subject + verb."}, {"p": "You tell the receptionist you want to know the check-out time.", "c": "I'd like to know what time check-out is.", "w": [["I'd like to know what time is check-out.", "In an indirect question the verb comes after the subject: check-out is."], ["I'd like know what time check-out is.", "\"Would like\" needs \"to\": I'd like to know."]], "tip": "I'd like to know + question word + subject + verb."}, {"p": "You want your friend to remember where he bought his phone.", "c": "Do you remember where you bought your phone?", "w": [["Do you remember where did you buy your phone?", "Indirect questions don't use did. Use the past form \"bought\"."], ["Do you remember where you buyed your phone?", "\"Buy\" is irregular: the past is \"bought\"."]], "tip": "Use the past verb itself (bought), not did + base."}, {"p": "You want to know how long the course lasts.", "c": "Do you know how long the course lasts?", "w": [["Do you know how long does the course last?", "Indirect questions don't use does."], ["Do you know how long lasts the course?", "The subject (the course) must come before the verb."]], "tip": "...how long + subject + verb."}, {"p": "You want to know what the manager said in the meeting.", "c": "Do you know what the manager said?", "w": [["Do you know what did the manager say?", "Indirect questions don't use did. Use the past form \"said\"."], ["Do you know what the manager did say?", "Don't keep \"did\". Just use \"said\"."]], "tip": "...what + subject + past verb."}, {"p": "You want to know when the next bus comes.", "c": "Do you know when the next bus comes?", "w": [["Do you know when does the next bus come?", "Indirect questions don't use does."], ["Do you know when the next bus come?", "\"The next bus\" = it, so the verb is \"comes\"."]], "tip": "...when + subject + verb (with -s)."}, {"p": "You want to know if the hotel has Wi-Fi.", "c": "Do you know if the hotel has Wi-Fi?", "w": [["Do you know does the hotel have Wi-Fi?", "Yes/no indirect questions use \"if\" or \"whether\", not \"does\"."], ["Do you know if has the hotel Wi-Fi?", "After \"if\", use normal order: the hotel has."]], "tip": "Do you know + if + subject + verb?"}, {"p": "You want to know if the test is on Friday.", "c": "Could you tell me if the test is on Friday?", "w": [["Could you tell me is the test on Friday?", "A yes/no indirect question needs \"if\" or \"whether\"."], ["Could you tell me if is the test on Friday?", "After \"if\", use normal order: the test is."]], "tip": "Could you tell me + if + subject + verb?"}, {"p": "You want to know if your friend is coming tonight.", "c": "I'd like to know if you are coming tonight.", "w": [["I'd like to know are you coming tonight.", "A yes/no indirect question needs \"if\" or \"whether\"."], ["I'd like to know if are you coming tonight.", "After \"if\", use normal order: you are coming."]], "tip": "I'd like to know + if + subject + verb."}, {"p": "You want to know if a shop sells phone cases.", "c": "Can you tell me if you sell phone cases?", "w": [["Can you tell me if do you sell phone cases?", "Don't use \"do\" after \"if\". Say \"if you sell\"."], ["Can you tell me do you sell phone cases?", "A yes/no indirect question needs \"if\" or \"whether\"."]], "tip": "...if + subject + verb (no do)."}, {"p": "You want to know if the museum was open yesterday.", "c": "Do you know if the museum was open yesterday?", "w": [["Do you know if was the museum open yesterday?", "After \"if\", use normal order: the museum was."], ["Do you know if the museum did open yesterday?", "\"Open\" here is an adjective, so use \"was\", not \"did\"."]], "tip": "...if + subject + was/were."}, {"p": "You are thinking about the weather tomorrow.", "c": "I wonder if it will snow tomorrow.", "w": [["I wonder will it snow tomorrow.", "After \"I wonder\", a yes/no idea needs \"if\" or \"whether\"."], ["I wonder if will it snow tomorrow.", "After \"if\", use normal order: it will snow."]], "tip": "I wonder + if + subject + will + verb."}, {"p": "You want to know whether you need to see the doctor again.", "c": "Could you tell me whether I need to come back?", "w": [["Could you tell me whether do I need to come back?", "Don't use \"do\" after \"whether\"."], ["Could you tell me whether I need come back?", "\"Need\" is followed by \"to\": need to come."]], "tip": "...whether + subject + verb."}, {"p": "You want to know if your classmate finished the homework.", "c": "Can you tell me if you finished the homework?", "w": [["Can you tell me if did you finish the homework?", "Don't use \"did\" after \"if\". Use the past form \"finished\"."], ["Can you tell me that you finished the homework?", "For a yes/no question use \"if\" or \"whether\", not \"that\"."]], "tip": "...if + subject + past verb."}, {"p": "You want to know if the printer is working.", "c": "Do you know if the printer is working?", "w": [["Do you know if is the printer working?", "After \"if\", use normal order: the printer is working."], ["Do you know if the printer working?", "The verb \"is\" is missing."]], "tip": "...if + subject + is + -ing."}, {"p": "You want to ask your landlord if pets are allowed.", "c": "Could you tell me if pets are allowed in the flat?", "w": [["Could you tell me if are pets allowed in the flat?", "After \"if\", use normal order: pets are allowed."], ["Could you tell me if pets allowed in the flat?", "The passive needs \"are\": pets are allowed."]], "tip": "...if + subject + are + past participle."}, {"p": "You want to find out who broke the window.", "c": "Who broke the window?", "w": [["Who did break the window?", "\"Who\" is the subject (someone broke it), so no \"did\" is needed."], ["Who did broke the window?", "Subject questions don't use \"did\". Also, the base form after \"did\" would be \"break\"."]], "tip": "Who is the subject → no do/does/did."}, {"p": "You want to know what happened at the meeting.", "c": "What happened at the meeting?", "w": [["What did happen at the meeting?", "\"What\" is the subject here, so no \"did\" is needed."], ["What did it happen at the meeting?", "Don't add \"did\" or an extra \"it\". \"What\" is already the subject."]], "tip": "What happened? (no did)"}, {"p": "You want to know which team won the match.", "c": "Which team won the match?", "w": [["Which team did win the match?", "\"Which team\" is the subject, so no \"did\" is needed."], ["Which team did won the match?", "No \"did\" in subject questions, and never \"did\" + past form."]], "tip": "Which + noun as subject → normal order."}, {"p": "You want to know who your friend is talking to on the phone.", "c": "Who are you talking to?", "w": [["Who are you talking?", "We \"talk to\" someone, so keep \"to\" at the end."], ["Who you are talking to?", "In a direct question \"are\" comes before \"you\"."]], "tip": "Keep the preposition at the end: Who are you talking to?"}, {"p": "You want to know what your friend is looking for.", "c": "What are you looking for?", "w": [["What are you looking?", "We \"look for\" something, so keep \"for\" at the end."], ["What do you looking for?", "Use \"are\" with -ing, not \"do\"."]], "tip": "What + are + subject + -ing + preposition?"}, {"p": "You want to know who lives in that big house.", "c": "Who lives in that house?", "w": [["Who does live in that house?", "\"Who\" is the subject, so no \"does\" is needed."], ["Who live in that house?", "\"Who\" takes a singular verb: \"lives\"."]], "tip": "Who + verb with -s?"}, {"p": "You want to know the topic of a film.", "c": "What is the film about?", "w": [["What is about the film?", "The preposition \"about\" goes at the end: What is the film about?"], ["About what the film is?", "This word order is wrong. Use \"What is the film about?\"."]], "tip": "What is it about? (preposition at the end)"}, {"p": "You want to know how many students came to class today.", "c": "How many students came to class today?", "w": [["How many students did come to class today?", "\"How many students\" is the subject, so no \"did\" is needed."], ["How many students did they come to class today?", "Don't add \"did they\". \"How many students\" is already the subject."]], "tip": "How many + noun as subject → past verb (came)."}, {"p": "You want to know who your friend went to the cinema with.", "c": "Who did you go to the cinema with?", "w": [["Who did you went to the cinema with?", "After \"did\", use the base verb \"go\"."], ["Who you went to the cinema with?", "\"Who\" is the object here (you went with someone), so you need \"did\"."]], "tip": "Object question: Who + did + subject + base verb + preposition?"}, {"p": "You want to know what makes your friend happy.", "c": "What makes you happy?", "w": [["What does make you happy?", "\"What\" is the subject, so no \"does\" is needed."], ["What do you make happy?", "This changes the meaning: it asks what YOU make happy."]], "tip": "What + verb (-s) + object? when \"what\" is the subject."}, {"p": "You want to know if your friend has ever visited Paris.", "c": "Have you ever been to Paris?", "w": [["Did you ever been to Paris?", "With \"been\", use \"have\", not \"did\"."], ["Have you ever went to Paris?", "After \"have\", use the past participle \"been\" (or \"gone\"), not \"went\"."]], "tip": "Experiences: Have you ever + past participle?"}, {"p": "You want to know how long your colleague has worked at the company.", "c": "How long have you worked here?", "w": [["How long do you work here?", "For time from the past until now, use the present perfect: have you worked."], ["How long you have worked here?", "In a direct question \"have\" comes before \"you\"."]], "tip": "How long + have + subject + past participle?"}, {"p": "You want to know how long it takes to get to the airport.", "c": "How long does it take to get to the airport?", "w": [["How long it takes to get to the airport?", "The helper \"does\" is missing."], ["How long does it take to get airport?", "We \"get to\" a place, so you need \"to\"."]], "tip": "How long does it take to + verb?"}, {"p": "You want to know if your classmate has finished her essay.", "c": "Have you finished your essay?", "w": [["Did you finished your essay?", "After \"did\", use the base verb (\"Did you finish\"), or use \"Have you finished\"."], ["Have you finish your essay?", "After \"have\", use the past participle \"finished\"."]], "tip": "Have + subject + past participle?"}, {"p": "You want to know who a bag belongs to.", "c": "Whose bag is this?", "w": [["Who's bag is this?", "\"Who's\" means \"who is\". For owners, use \"whose\"."], ["Whose is bag this?", "The word order is wrong. Use \"Whose bag is this?\"."]], "tip": "Whose + noun + is this?"}, {"p": "You want to know the distance to the station.", "c": "How far is the station?", "w": [["How far the station is?", "In a direct question \"is\" comes before the subject."], ["How much far is the station?", "Use \"how far\", not \"how much far\"."]], "tip": "How far + is + subject?"}, {"p": "You want to know which film your friend prefers.", "c": "Which film do you prefer?", "w": [["Which film you prefer?", "The helper \"do\" is missing."], ["Which film do you prefers?", "After \"do\", use the base verb \"prefer\"."]], "tip": "Which + noun + do + subject + base verb?"}, {"p": "You want to know how many languages your friend speaks.", "c": "How many languages do you speak?", "w": [["How much languages do you speak?", "\"Languages\" can be counted, so use \"how many\", not \"how much\"."], ["How many languages you speak?", "The helper \"do\" is missing."]], "tip": "Countable nouns → how many."}, {"p": "You want to know what your colleague has been doing all morning.", "c": "What have you been doing all morning?", "w": [["What have you been do all morning?", "After \"been\", use the -ing form: \"doing\"."], ["What did you been doing all morning?", "The present perfect continuous uses \"have\", not \"did\"."]], "tip": "What + have + subject + been + -ing?"}, {"p": "You want to know why your friend didn't come to class.", "c": "Why didn't you come to class?", "w": [["Why didn't you came to class?", "After \"didn't\", use the base verb \"come\"."], ["Why you didn't come to class?", "In a direct question \"didn't\" comes before \"you\"."]], "tip": "Why + didn't + subject + base verb?"}]}, {"id": "g2", "title": "First conditional: if / unless, will / won't", "intro": "Choose the correct option to complete the sentence.", "items": [{"p": "___ you hurry, you will miss the bus.", "c": "Unless", "w": [["If", "\"If\" gives the opposite meaning here, so the sentence doesn't make sense. You need \"unless\" (= if … not)."], ["Without", "\"Without\" is followed by a noun or -ing form, not a full clause with a subject and verb."]], "tip": "Unless = if … not. After if / unless, use the present simple."}, {"p": "___ you wear a coat, you will feel cold outside.", "c": "Unless", "w": [["If", "\"If\" gives the opposite meaning here, so the sentence doesn't make sense. You need \"unless\" (= if … not)."], ["Without", "\"Without\" is followed by a noun or -ing form, not a full clause with a subject and verb."]], "tip": "Unless = if … not. After if / unless, use the present simple."}, {"p": "___ it rains tomorrow, we will have a picnic.", "c": "Unless", "w": [["If", "\"If\" gives the opposite meaning here, so the sentence doesn't make sense. You need \"unless\" (= if … not)."], ["Without", "\"Without\ g form, not a full clause with a subject and verb."]], "tip": "Unless = if … not. After if / unless, use the present simple."}, {"p": "___ he apologises, I won't talk to him again.", "c": "Unless", "w": [["If", "\"If\" gives the opposite meaning here, so the sentence doesn't make sense. You need \"unless\" (= if … not)."], ["Without", "\"Without\" is followed by a noun or -ing form, not a full clause with a subject and verb."]], "tip": "Unless = if … not. After if / unless, use the present simple."}, {"p": "I ___ call you if I finish work early.", "c": "will", "w": [["won't", "\"won't\" gives the opposite meaning, so the result doesn't make sense with the condition."], ["would", "\"would\" is for imaginary situations (second conditional). This is a real possibility, so use will / won't."]], "tip": "If + present simple, will / won't + base verb."}, {"p": "She ___ pass the exam unless she studies harder.", "c": "won't", "w": [["will", "\"will\" gives the opposite meaning, so the result doesn't make sense with the condition."], ["wouldn't", "\"wouldn't\" is for imaginary situations (second conditional). This is a real possibility, so use will / won't."]], "tip": "If + present simple, will / won't + base verb."}, {"p": "You ___ get a prize if you answer all the questions correctly.", "c": "will", "w": [["won't", "\"won't\" gives the opposite meaning, so the result doesn't make sense with the condition."], ["would", "\"would\" is for imaginary situations (second conditional). This is a real possibility, so use will / won't."]], "tip": "If + present simple, will / won't + base verb."}, {"p": "He ___ feel better if he takes the medicine on time.", "c": "will", "w": [["won't", "\"won't\" gives the opposite meaning, so the result doesn't make sense with the condition."], ["would", "\"would\" is for imaginary situations (second conditional). This is a real possibility, so use will / won't."]], "tip": "If + present simple, will / won't + base verb."}, {"p": "We ___ finish dinn take."}]}, {"id": "g7", "title": "Reported speech", "intro": "Choose the correct REPORTED SPEECH sentence.", "items": [{"p": "\"I can't find my keys,\" he said.", "c": "He said (that) he couldn't find his keys.", "w": [["He said he can't find my keys.", "In reported speech the tense usually moves back (am → was, will → would, can → could, present → past). The pronouns must change to fit who is speaking and listening (I → he/she, my → his/her, you → me…)."], ["He said he couldn't find my keys.", "The pronouns must change to fit who is speaking and listening (I → he/she, my → his/her, you → me…)."]], "tip": "Statements: said (that) … / told + person (that) … · move the tense back · change pronouns and time words."}, {"p": "\"We enjoyed the concert last night,\" they said.", "c": "They said (that) they had enjoyed the concert the night before.", "w": [["They said we had enjoyed the concert the night before.", "The pronouns must change to fit who is speaking and listening (I → he/she, my → his/her, you → me…)."], ["They said they had enjoyed the concert last night.", "Time and place words change: now → then, today → that day, tomorrow → the next day, yesterday → the day before, last night → the night before, next week → the following week, this → that, here → there."]], "tip": "Statements: said (that) … / told + person (that) … · move the tense back · change pronouns and time words."}, {"p": "\"I have never eaten sushi,\" Anna told me.", "c": "Anna told me (that) she had never eaten sushi.", "w": [["Anna told me she has never ate sushi.", "The past simple and present perfect move back to the past perfect: had + V3. Use the correct V3 (past participle) form after \"had\"."], ["Anna told that she had never eaten sushi.", "\"Told\" needs a person after it (told me / told her). Without a person, use \"said\"."]], "tip": "Statements: said (that) … / told + person (that) … · move the tense back · change pronouns and time words."}, {"p": "\"I will help you tomorrow,\" he said to me.", "c": "He said (that) he would help me the next day.", "w": [["He said he will help me tomorrow.", "In reported speech the tense usually moves back (am → was, will → would, can → could, present → past). Time and place words change: now → then, today → that day, tomorrow → the next day, yesterday → the day before, last night → the night before, next week → the following week, this → that, here → there."], ["He said he would help you the next day.", "The pronouns must change to fit who is speaking and listening (I → he/she, my → his/her, you → me…)."]], "tip": "Statements: said (that) … / told + person (that) … · move the tense back · change pronouns and time words."}, {"p": "\"You should wear a helmet,\" the instructor told us.", "c": "The instructor told us (that) we should wear a helmet.", "w": [["The instructor told us that you should wear a helmet.", "The pronouns must change to fit who is speaking and listening (I → he/she, my → his/her, you → me…)."], ["The instructor told us to should wear a helmet.", "Modals like should, might and could don't change, and they are never followed by \"to\"."]], "tip": "Statements: said (that) … / told + person (that) … · move the tense back · change pronouns and time words."}, {"p": "\"I am going to the supermarket now,\" Maria said.", "c": "Maria said (that) she was going to the supermarket then.", "w": [["Maria said she is going to the supermarket now.", "In reported speech the tense usually moves back (am → was, will → would, can → could, present → past). Time and place words change: now → then, today → that day, tomorrow → the next day, yesterday → the day before, last night → the night before, next week → the following week, this → that, here → there."], ["Maria said she was go to the supermarket then.", "Continuous tenses need the -ing form (was going, were watching)."]], "tip": "Statements: said (that) … / told + person (that) … · move the tense back · change pronouns and time words."}, {"p": "\"Don't forget to call me,\" she told me.", "c": "She told me not to forget to call her.", "w": [["She told me don't forget to call her.", "For negative commands, use told / asked + person + not to + base verb."], ["She told me not to forget to call me.", "The pronouns must change to fit who is speaking and listening (I → he/she, my → his/her, you → me…)."]], "tip": "Commands and requests: told / asked + person + (not) to + base verb."}, {"p": "\"Close the door, please,\" the teacher said to me.", "c": "The teacher asked me to close the door.", "w": [["The teacher asked me close the door.", "For commands and requests, use told / asked + person + to + base verb."], ["The teacher asked me closing the door.", "For commands and requests, use told / asked + person + to + base verb."]], "tip": "Commands and requests: told / asked + person + (not) to + base verb."}, {"p": "\"I'm really tired,\" she said.", "c": "She said (that) she was really tired.", "w": [["She said she were really tired.", "Check the verb: I / he / she / it take \"was\", you / we / they take \"were\"."], ["She said me she was really tired.", "\"Said\" isn't followed directly by a person. Use \"told me\" or \"said to me\"."]], "tip": "Statements: said (that) … / told + person (that) … · move the tense back · change pronouns and time words."}, {"p": "\"We are watching a film,\" they said.", "c": "They said (that) they were watching a film.", "w": [["They said they was watching a film.", "Check the verb: I / he / she / it take \"was\", you / we / they take \"were\"."], ["They said they are watched a film.", "\"Are watched\" is passive and the wrong tense. Use \"were watching\"."]], "tip": "Statements: said (that) … / told + person (that) … · move the tense back · change pronouns and time words."}, {"p": "\"I bought a new phone yesterday,\" he said.", "c": "He said (that) he had bought a new phone the day before.", "w": [["He said he had buyed a new phone the day before.", "Use the correct V3 (past participle) form after \"had\"."], ["He said he has bought a new phone the day before.", "The past simple and present perfect move back to the past perfect: had + V3."]], "tip": "Statements: said (that) … / told + person (that) … · move the tense back · change pronouns and time words."}, {"p": "\"I live in Bukhara,\" Aziz told me.", "c": "Aziz told me (that) he lived in Bukhara.", "w": [["Aziz told me (that) I lived in Bukhara.", "The pronouns must change to fit who is speaking and listening (I → he/she, my → his/her, you → me…)."], ["Aziz said me that he lived in Bukhara.", "\"Said\" isn't followed directly by a person. Use \"told me\" or \"said to me\"."]], "tip": "Statements: said (that) … / told + person (that) … · move the tense back · change pronouns and time words."}, {"p": "\"I don't like coffee,\" my sister said.", "c": "My sister said (that) she didn't like coffee.", "w": [["My sister said she doesn't liked coffee.", "After didn't / doesn't, use the base verb. The tense also moves back: didn't like."], ["My sister said she not liked coffee.", "Past negatives need \"didn't + base verb\": she didn't like."]], "tip": "Statements: said (that) … / told + person (that) … · move the tense back · change pronouns and time words."}, {"p": "\"We can't come to the party,\" they said.", "c": "They said (that) they couldn't come to the party.", "w": [["They said they can't came to the party.", "Can't moves back to couldn't, and after can't / couldn't use the base verb \"come\"."], ["They said we couldn't come to the party.", "The pronouns must change to fit who is speaking and listening (I → he/she, my → his/her, you → me…)."]], "tip": "Statements: said (that) … / told + person (that) … · move the tense back · change pronouns and time words."}, {"p": "\"Sit down, please,\" the doctor said to me.", "c": "The doctor asked me to sit down.", "w": [["The doctor asked me sit down.", "For commands and requests, use told / asked + person + to + base verb."], ["The doctor asked to me to sit down.", "After \"asked\", put the person directly: asked me, not asked to me."]], "tip": "Commands and requests: told / asked + person + (not) to + base verb."}, {"p": "\"Don't touch the oven,\" Mum told the children.", "c": "Mum told the children not to touch the oven.", "w": [["Mum told the children to don't touch the oven.", "For negative commands, use told / asked + person + not to + base verb."], ["Mum told the children not touch the oven.", "For negative commands, use told / asked + person + not to + base verb."]], "tip": "Commands and requests: told / asked + person + (not) to + base verb."}, {"p": "\"I'm going to study medicine,\" Lola said.", "c": "Lola said (that) she was going to study medicine.", "w": [["Lola said she is going to studied medicine.", "After \"going to\", use the base verb, and am / is moves back to was."], ["Lola told she was going to study medicine.", "\"Told\" needs a person after it (told me / told her). Without a person, use \"said\"."]], "tip": "Statements: said (that) … / told + person (that) … · move the tense back · change pronouns and time words."}, {"p": "\"The train leaves at six,\" the guard said.", "c": "The guard said (that) the train left at six.", "w": [["The guard said the train leave at six.", "\"The train\" = it, so the verb needs the past form \"left\" (or \"leaves\"), not \"leave\"."], ["The guard told the train left at six.", "\"Told\" needs a person after it (told me / told her). Without a person, use \"said\"."]], "tip": "Statements: said (that) … / told + person (that) … · move the tense back · change pronouns and time words."}, {"p": "\"I've lost my wallet,\" Tom said.", "c": "Tom said (that) he had lost his wallet.", "w": [["Tom said he has lost my wallet.", "In reported speech the tense usually moves back (am → was, will → would, can → could, present → past). The pronouns must change to fit who is speaking and listening (I → he/she, my → his/her, you → me…)."], ["Tom said he had lose his wallet.", "Use the correct V3 (past participle) form after \"had\"."]], "tip": "Statements: said (that) … / told + person (that) … · move the tense back · change pronouns and time words."}, {"p": "\"We will win the match,\" the captain said.", "c": "The captain said (that) they would win the match.", "w": [["The captain said they will won the match.", "Will moves back to would, and after will / would use the base verb \"win\"."], ["The captain said (that) we would win the match.", "The pronouns must change to fit who is speaking and listening (I → he/she, my → his/her, you → me…)."]], "tip": "Statements: said (that) … / told + person (that) … · move the tense back · change pronouns and time words."}, {"p": "\"I'm meeting my friends today,\" Sara said.", "c": "Sara said (that) she was meeting her friends that day.", "w": [["Sara said she was meeting her friends today.", "Time and place words change: now → then, today → that day, tomorrow → the next day, yesterday → the day before, last night → the night before, next week → the following week, this → that, here → there."], ["Sara said she were meeting her friends that day.", "Check the verb: I / he / she / it take \"was\", you / we / they take \"were\"."]], "tip": "Statements: said (that) … / told + person (that) … · move the tense back · change pronouns and time words."}, {"p": "\"Please help me with my bags,\" the old man said to us.", "c": "The old man asked us to help him with his bags.", "w": [["The old man asked us to help me with my bags.", "The pronouns must change to fit who is speaking and listening (I → he/she, my → his/her, you → me…)."], ["The old man asked us helping him with his bags.", "For commands and requests, use told / asked + person + to + base verb."]], "tip": "Commands and requests: told / asked + person + (not) to + base verb."}, {"p": "\"Be quiet!\" the librarian told the students.", "c": "The librarian told the students to be quiet.", "w": [["The librarian told the students be quiet.", "For commands and requests, use told / asked + person + to + base verb."], ["The librarian told to the students to be quiet.", "Use \"told + person\", not \"told to + person\"."]], "tip": "Commands and requests: told / asked + person + (not) to + base verb."}, {"p": "\"I didn't see the sign,\" the driver said.", "c": "The driver said (that) he hadn't seen the sign.", "w": [["The driver said he hadn't saw the sign.", "Use the correct V3 (past participle) form after \"had\"."], ["The driver said he didn't saw the sign.", "After \"didn't\", use the base verb. Better: he hadn't seen."]], "tip": "Statements: said (that) … / told + person (that) … · move the tense back · change pronouns and time words."}, {"p": "\"You look tired,\" my mum said to me.", "c": "My mum told me (that) I looked tired.", "w": [["My mum told me (that) you looked tired.", "The pronouns must change to fit who is speaking and listening (I → he/she, my → his/her, you → me…)."], ["My mum said me that I looked tired.", "\"Said\" isn't followed directly by a person. Use \"told me\" or \"said to me\"."]], "tip": "Statements: said (that) … / told + person (that) … · move the tense back · change pronouns and time words."}, {"p": "\"I can swim very well,\" Bobur said.", "c": "Bobur said (that) he could swim very well.", "w": [["Bobur said he can swam very well.", "Can moves back to could, and after can / could use the base verb \"swim\"."], ["Bobur told that he could swim very well.", "\"Told\" needs a person after it (told me / told her). Without a person, use \"said\"."]], "tip": "Statements: said (that) … / told + person (that) … · move the tense back · change pronouns and time words."}, {"p": "\"We are moving to Tashkent next month,\" they said.", "c": "They said (that) they were moving to Tashkent the following month.", "w": [["They said they were moving to Tashkent next month.", "Time and place words change: now → then, today → that day, tomorrow → the next day, yesterday → the day before, last night → the night before, next week → the following week, this → that, here → there."], ["They said they was moving to Tashkent the following month.", "Check the verb: I / he / she / it take \"was\", you / we / they take \"were\"."]], "tip": "Statements: said (that) … / told + person (that) … · move the tense back · change pronouns and time words."}, {"p": "\"Don't be late,\" the coach told us.", "c": "The coach told us not to be late.", "w": [["The coach told us don't be late.", "For negative commands, use told / asked + person + not to + base verb."], ["The coach told us to not being late.", "For negative commands, use told / asked + person + not to + base verb."]], "tip": "Commands and requests: told / asked + person + (not) to + base verb."}, {"p": "\"I have finished my essay,\" Nigora said.", "c": "Nigora said (that) she had finished her essay.", "w": [["Nigora said she had finish her essay.", "Use the correct V3 (past participle) form after \"had\"."], ["Nigora said she has finished my essay.", "In reported speech the tense usually moves back (am → was, will → would, can → could, present → past). The pronouns must change to fit who is speaking and listening (I → he/she, my → his/her, you → me…)."]], "tip": "Statements: said (that) … / told + person (that) … · move the tense back · change pronouns and time words."}, {"p": "\"It's raining,\" he said.", "c": "He said (that) it was raining.", "w": [["He said it were raining.", "Check the verb: I / he / she / it take \"was\", you / we / they take \"were\"."], ["He said it is rain.", "The tense moves back and the continuous needs -ing: it was raining."]], "tip": "Statements: said (that) … / told + person (that) … · move the tense back · change pronouns and time words."}, {"p": "\"I'll call you later,\" my friend said to me.", "c": "My friend said (that) he would call me later.", "w": [["My friend said he would call you later.", "The pronouns must change to fit who is speaking and listening (I → he/she, my → his/her, you → me…)."], ["My friend said he will calls m sively than", "Use \"as … as\", not \"so … than\"."]], "tip": "Short adjective + -er + than · more / less + long adjective + than · as + adjective + as = the same · much / far / a lot + comparative."}, {"p": "This winter is colder than last winter. → Last winter was ___ this one. (less)", "c": "less cold than", "w": [["less colder than", "After \"less\", use the base adjective (less cold, not less colder)."], ["more cold than", "This reverses the meaning of the first sentence. Short adjectives take -er (bigger, faster, safer), not \"more\"."]], "tip": "Short adjective + -er + than · more / less + long adjective + than · as + adjective + as = the same · much / far / a lot + comparative."}, {"p": "The hotel room isn't as spacious as the apartment. → The apartment is ___ the hotel room. (much)", "c": "much more spacious than", "w": [["much spacious than", "Long adjectives and adverbs use more / less, not -er."], ["very more spacious than", "Use much / far / a lot before a comparative, not \"very\"."]], "tip": "Short adjective + -er + than · more / less + long adjective + than · as + adjective + as = the same · much / far / a lot + comparative."}, {"p": "The old phone is cheaper than the new one. → The new phone is ___ the old one. (expensive)", "c": "more expensive than", "w": [["expensiver than", "Long adjectives and adverbs use more / less, not -er."], ["more expensive that", "After a comparative (more / less / -er), use \"than\", not \"as\", \"that\" or \"then\"."]], "tip": "Short adjective + -er + than · more / less + long adjective + than · as + adjective + as = the same · much / far / a lot + comparative."}, {"p": "This puzzle is more challenging than the last one. → The last puzzle was ___ this one. (less)", "c": "less challenging than", "w": [["less challenging that", "After a comparative (more / less / -er), use \"than\", not \"as\", \"that\" or \"then\"."], ["lesser challenging than", "\"Lesser\" isn't used like this. Use \"less\"."]], "tip": "Short adjective erb (-ly)."]], "tip": "Short adjective + -er + than · more / less + long adjective + than · as + adjective + as = the same · much / far / a lot + comparative."}, {"p": "The Amazon is longer than the Danube. → The Danube is ___ the Amazon. (short)", "c": "shorter than", "w": [["more short than", "Short adjectives take -er (bigger, faster, safer), not \"more\"."], ["shorter as", "After a comparative (more / less / -er), use \"than\", not \"as\", \"that\" or \"then\"."]], "tip": "Short adjective + -er + than · more / less + long adjective + than · as + adjective + as = the same · much / far / a lot + comparative."}, {"p": "Learning to drive was harder than I expected. → Learning to drive wasn't ___ I expected. (easy)", "c": "as easy as", "w": [["as easier as", "Use as + base adjective + as (not \"as … than\" or \"as …-er as\")."], ["so easy than", "Use \"as … as\", not \"so … than\"."]], "tip": "Short adjective + -er + than · more / less + long adjective + than · as + adjective + as = the same · much / far / a lot + comparative."}, {"p": "This street is noisier than ours. → Our street is ___ this one. (quiet)", "c": "quieter than", "w": [["more quieter than", "Don't use two comparatives together (more + -er, or more + less)."], ["quieter that", "After a comparative (more / less / -er), use \"than\", not \"as\", \"that\" or \"then\"."]], "tip": "Short adjective + -er + than · more / less + long adjective + than · as + adjective + as = the same · much / far / a lot + comparative."}, {"p": "Her English is much better than mine. → My English is ___ hers. (much)", "c": "much worse than", "w": [["much more bad than", "This adjective is irregular: good / well → better, bad / badly → worse."], ["much better than", "This reverses the meaning of the first sentence."]], "tip": "Short adjective + -er + than · more / less + long adjective + than · as + adjective + as = the same · much / far / a lot + comparative."}, {"p": "Today's test wasn't as long as yesterday's. → Yesterday's t
